<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="description" content="Claude Code로 만드는 나만의 CS 기반 지식 강의" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f97316" />
    <title>Punisher</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("punisher-theme");
          p = p ? JSON.parse(p) : "system";
          var d = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-canvas text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
