# 분산 시스템 — 큐·멱등성·일관성·캐시·장애 전파
area: distributed
title: 분산 시스템
concepts:
  - id: dist.partial-failure
    name: 분산 시스템과 부분 실패
    aliases: [Distributed System, 분산 시스템, Partial Failure, 부분 실패, 네트워크는 신뢰할 수 없다]
    depth: 1
    summary: 여러 프로세스가 네트워크로 협력하면 일부만 실패하거나, 실패했는지조차 알 수 없는 상황이 생긴다. 타임아웃은 상대가 처리했는지 알려주지 않는다.
    objectives:
      - 로컬 호출과 원격 호출의 근본적 차이(지연·실패·불확실성)를 설명한다
      - 타임아웃이 났을 때 상대가 처리했을 수도 있다는 점을 설명한다
      - 부분 실패를 전제로 설계해야 하는 지점을 찾는다
    prerequisites: [net.timeouts]
    practical_cases:
      - 결제 API 타임아웃 후 실제로는 결제가 승인되어 있던 사례

  - id: dist.idempotency
    name: 멱등성
    aliases: [Idempotency, 멱등, Idempotency Key, 멱등 키, 중복 요청 방지]
    depth: 1
    summary: 같은 요청을 여러 번 보내도 결과가 한 번 보낸 것과 같도록 만드는 성질이다. 재시도·중복 메시지가 피할 수 없는 환경에서 중복 결제를 막는 핵심 도구다.
    objectives:
      - 재시도 버튼이 중복 결제를 만들 수 있는 과정을 설명한다
      - 멱등 키와 유니크 제약으로 중복 처리를 막는 방법을 설명한다
      - 멱등 키 저장 범위·만료와 동시에 들어온 같은 요청 처리 방식을 설명한다
    prerequisites: [net.retry-and-backoff, dist.partial-failure]
    practical_cases:
      - 결제 요청에 Idempotency-Key 헤더를 두어 네트워크 재시도에도 한 번만 승인
      - 재시작마다 같은 리포트를 다시 생성하던 스케줄러를 DB 유니크 키로 멱등화
    doc_links:
      - title: Stripe API - Idempotent requests
        url: https://docs.stripe.com/api/idempotent_requests

  - id: dist.message-queue
    name: 메시지 큐
    aliases: [Message Queue, MQ, 메시지 브로커, Message Broker, Kafka, RabbitMQ, SQS]
    depth: 1
    summary: 메시지 큐는 생산자와 소비자를 시간적으로 분리해 부하를 흡수하고 비동기 처리를 가능하게 한다. 소비 지연(lag)과 실패 메시지 처리가 운영의 핵심이다.
    objectives:
      - 동기 호출 대신 큐를 두었을 때 얻는 것과 잃는 것을 설명한다
      - 소비 지연(lag)과 처리량의 관계를 설명한다
      - 실패 메시지를 DLQ로 보내 격리하는 이유를 설명한다
    prerequisites: [ds.queue, dist.partial-failure]
    practical_cases:
      - 이메일 발송을 큐로 분리해 가입 API 지연을 줄인 사례

  - id: dist.delivery-semantics
    name: 메시지 전달 보장
    aliases: [Delivery Semantics, At-least-once, At-most-once, Exactly-once, 최소 한 번 전달, 전달 보장]
    depth: 2
    summary: 대부분의 메시징은 최소 한 번 전달을 보장하므로 소비자는 중복을 견뎌야 한다. 정확히 한 번은 전달이 아니라 처리 결과를 멱등하게 만들어 얻는다.
    objectives:
      - at-most-once·at-least-once·exactly-once의 차이를 설명한다
      - 처리 후 ack 전에 죽으면 중복이 생기는 과정을 설명한다
      - 소비자를 멱등하게 만들어 중복을 흡수하는 방법을 설명한다
    prerequisites: [dist.message-queue, dist.idempotency]
    practical_cases:
      - 소비자 재시작 후 같은 주문 알림이 두 번 발송된 문제
    doc_links:
      - title: Apache Kafka - Message Delivery Semantics
        url: https://kafka.apache.org/documentation/#semantics

  - id: dist.outbox-pattern
    name: 트랜잭셔널 아웃박스
    aliases: [Outbox Pattern, Transactional Outbox, 아웃박스 패턴, 이중 쓰기 문제, Dual Write]
    depth: 3
    summary: DB 저장과 메시지 발행을 따로 하면 둘 중 하나만 성공할 수 있다. 같은 트랜잭션으로 아웃박스 테이블에 기록하고 별도 프로세스가 발행한다.
    objectives:
      - DB 쓰기와 메시지 발행의 이중 쓰기 문제를 설명한다
      - 아웃박스 테이블과 릴레이로 원자성을 얻는 구조를 설명한다
    prerequisites: [dist.delivery-semantics, db.transaction]
    practical_cases:
      - 주문은 저장됐는데 주문 생성 이벤트가 발행되지 않아 배송이 누락된 장애

  - id: dist.caching
    name: 캐싱 전략
    aliases: [Caching, 캐싱, 캐시 전략, Cache-Aside, Write-Through, 애플리케이션 캐시]
    depth: 1
    summary: 캐시는 비싼 결과를 가까운 곳에 저장해 지연과 부하를 줄이지만, 원본과 다를 수 있다는 비용을 낸다. 무엇을 얼마나 오래 틀려도 되는지가 설계 기준이다.
    objectives:
      - cache-aside·write-through 방식의 흐름을 설명한다
      - 캐시 적중률과 TTL이 효과와 정합성에 미치는 영향을 설명한다
      - 캐시가 장애 시 원본 부하를 폭증시키는 구조적 위험을 설명한다
    prerequisites: [arch.memory-hierarchy, dist.partial-failure]
    practical_cases:
      - 상품 상세 조회에 캐시를 두어 DB 부하를 90% 줄인 사례

  - id: dist.cache-invalidation
    name: 캐시 무효화
    aliases: [Cache Invalidation, 캐시 무효화, Stale Cache, 오래된 캐시]
    depth: 2
    summary: 원본이 바뀌었을 때 캐시를 언제 어떻게 버릴지가 캐싱의 가장 어려운 부분이다. 삭제와 갱신의 순서, 동시 요청이 오래된 값을 되살리는 경쟁이 핵심이다.
    objectives:
      - TTL 만료·명시적 삭제·이벤트 기반 무효화를 비교한다
      - 갱신 후 캐시 삭제 순서에 따라 오래된 값이 남는 경쟁 상황을 설명한다
    prerequisites: [dist.caching]
    practical_cases:
      - 가격을 바꿨는데 일부 사용자에게 옛 가격이 계속 보이는 문제

  - id: dist.cache-stampede
    name: 캐시 스탬피드
    aliases: [Cache Stampede, Thundering Herd, 썬더링 허드, 캐시 폭주, Dogpile]
    depth: 3
    summary: 인기 키가 만료되는 순간 많은 요청이 동시에 원본을 조회해 원본이 무너진다. 단일 비행(single flight), 조기 갱신, TTL 분산으로 막는다.
    objectives:
      - 인기 키 만료가 원본 부하 폭증으로 이어지는 과정을 설명한다
      - single flight·락·조기 갱신·TTL 지터로 완화하는 방법을 설명한다
    prerequisites: [dist.cache-invalidation]
    practical_cases:
      - 메인 페이지 캐시가 만료될 때마다 DB CPU가 100%로 튀는 현상

  - id: dist.consistency-models
    name: 일관성 모델
    aliases: [Consistency Model, 일관성, Strong Consistency, Eventual Consistency, 최종적 일관성, 강한 일관성]
    depth: 2
    summary: 강한 일관성은 모든 읽기가 최신 쓰기를 보게 하지만 비용이 크고, 최종적 일관성은 잠시 다른 값을 허용한다. 사용자 경험에서 어떤 불일치가 허용되는지 정해야 한다.
    objectives:
      - 강한 일관성과 최종적 일관성의 차이를 사례로 설명한다
      - read-your-writes 같은 세션 보장이 필요한 화면을 식별한다
    prerequisites: [dist.partial-failure, db.replication]
    practical_cases:
      - 댓글 작성 후 새로고침하면 내 댓글이 사라졌다 다시 보이는 현상

  - id: dist.cap-theorem
    name: CAP과 PACELC
    aliases: [CAP, CAP Theorem, CAP 정리, PACELC]
    depth: 2
    summary: 네트워크 분할이 생기면 일관성과 가용성 중 하나를 포기해야 하고, 평상시에도 지연과 일관성 사이에 선택이 있다. 시스템 선택의 언어로 쓰인다.
    objectives:
      - 네트워크 분할 상황에서 일관성과 가용성의 선택을 설명한다
      - PACELC가 평상시 지연-일관성 선택을 추가하는 의미를 설명한다
      - CAP을 기술 선택 근거로 쓸 때의 흔한 오해를 설명한다
    prerequisites: [dist.consistency-models]
    practical_cases:
      - 리전 간 복제 DB에서 분할 시 쓰기를 막을지 허용할지 결정

  - id: dist.consensus
    name: 합의 알고리즘
    aliases: [Consensus, 합의, Raft, Paxos, 리더 선출, Leader Election, Quorum, 쿼럼]
    depth: 3
    summary: 여러 노드가 하나의 값이나 순서에 동의하려면 다수결(쿼럼) 기반 합의가 필요하다. etcd·Zookeeper 같은 조정 시스템이 이를 제공한다.
    objectives:
      - 쿼럼과 다수결이 분할 상황에서 두 리더를 막는 원리를 설명한다
      - Raft의 리더 선출과 로그 복제를 개념 수준에서 설명한다
      - 합의 클러스터를 홀수 노드로 두는 이유를 설명한다
    prerequisites: [dist.consistency-models]
    practical_cases:
      - etcd 노드 과반이 죽어 Kubernetes 컨트롤 플레인이 쓰기를 못 하는 상황
    doc_links:
      - title: The Raft Consensus Algorithm
        url: https://raft.github.io/

  - id: dist.distributed-lock
    name: 분산 락
    aliases: [Distributed Lock, 분산 락, Lease, 리스, Fencing Token, 펜싱 토큰]
    depth: 3
    summary: 여러 인스턴스 중 하나만 작업하게 하려면 분산 락이 필요하지만, 락을 잃었는지 모르는 프로세스가 계속 쓸 수 있다. 리스와 펜싱 토큰으로 보완한다.
    objectives:
      - 단일 인스턴스 락과 분산 락의 차이를 설명한다
      - GC 정지나 네트워크 지연으로 락 만료 후에도 작업이 계속되는 문제를 설명한다
      - DB 유니크 제약·advisory lock으로 단순하게 해결할 수 있는 경우를 설명한다
    prerequisites: [dist.consensus, db.locking]
    practical_cases:
      - 서버 3대가 같은 스케줄 작업을 동시에 실행해 알림이 3번 발송된 문제

  - id: dist.clocks-and-ordering
    name: 시간과 이벤트 순서
    aliases: [Clock Skew, 시계 오차, 논리 시계, Lamport Clock, NTP, 이벤트 순서]
    depth: 3
    summary: 서버마다 시계가 조금씩 다르므로 타임스탬프로 이벤트 순서를 정하면 틀릴 수 있다. 순서가 중요하면 시퀀스나 논리 시계를 쓴다.
    objectives:
      - 시계 오차와 NTP 보정이 타임스탬프 비교를 어긋나게 하는 경우를 설명한다
      - 마지막 쓰기 우선(LWW)이 데이터를 잃는 상황을 설명한다
      - 논리 시계·DB 시퀀스로 순서를 정하는 방법을 설명한다
    prerequisites: [dist.partial-failure]
    practical_cases:
      - 두 서버의 시계 차이 때문에 나중 수정이 먼저 수정으로 덮어써진 문제

  - id: dist.cascading-failure
    name: 장애 전파
    aliases: [Cascading Failure, 연쇄 장애, 장애 전파, Retry Storm, 재시도 폭주]
    depth: 2
    summary: 한 서비스의 지연이 호출자들의 자원을 고갈시키고 재시도가 부하를 증폭시키며 장애가 퍼진다. 타임아웃·격벽·부하 차단으로 전파를 끊는다.
    objectives:
      - 느린 의존성이 호출자의 스레드·연결을 고갈시키는 과정을 설명한다
      - 재시도가 계층마다 곱해져 부하가 폭증하는 과정을 설명한다
      - 격벽(bulkhead)과 부하 차단(load shedding)의 역할을 설명한다
    prerequisites: [dist.partial-failure, net.retry-and-backoff]
    practical_cases:
      - 추천 서비스 하나가 느려져 메인 페이지 전체가 멈춘 장애

  - id: dist.circuit-breaker
    name: 서킷 브레이커
    aliases: [Circuit Breaker, 서킷브레이커, 회로 차단기, Fallback, 폴백]
    depth: 2
    summary: 서킷 브레이커는 실패가 계속되는 의존성 호출을 잠시 차단해 빠르게 실패하고 회복 시간을 준다. 차단 중 무엇을 보여줄지(폴백)를 함께 설계한다.
    objectives:
      - closed·open·half-open 상태 전이를 설명한다
      - 빠른 실패가 호출자 자원을 보호하는 이유를 설명한다
      - 폴백 응답 설계 시 사용자에게 보여줄 것과 숨기지 말아야 할 것을 설명한다
    prerequisites: [dist.cascading-failure]
    practical_cases:
      - 외부 환율 API 장애 시 마지막 값으로 폴백하고 화면에 기준 시각을 표시

  - id: dist.rate-limiting
    name: 레이트 리밋
    aliases: [Rate Limiting, Rate Limit, 속도 제한, 처리율 제한, Token Bucket, 토큰 버킷, 429]
    depth: 2
    summary: 레이트 리밋은 단위 시간당 요청 수를 제한해 자원을 보호하고 공정하게 나눈다. 토큰 버킷 같은 알고리즘과 분산 환경의 카운터 공유가 핵심이다.
    objectives:
      - 고정 윈도·슬라이딩 윈도·토큰 버킷 알고리즘을 비교한다
      - 인스턴스가 여러 대일 때 제한을 공유하는 방법과 비용을 설명한다
      - 429 응답과 Retry-After로 클라이언트에 알리는 방법을 설명한다
    prerequisites: [dist.partial-failure, net.http-status-codes]
    practical_cases:
      - 외부 LLM API의 분당 토큰 제한에 맞춰 호출을 조절하는 배치

  - id: dist.saga
    name: 사가 패턴
    aliases: [Saga, Saga Pattern, 사가, 보상 트랜잭션, Compensating Transaction]
    depth: 3
    summary: 여러 서비스에 걸친 작업은 하나의 DB 트랜잭션으로 묶을 수 없어, 단계별 로컬 트랜잭션과 실패 시 보상 작업으로 일관성을 맞춘다.
    objectives:
      - 분산 트랜잭션 대신 사가를 쓰는 이유를 설명한다
      - 보상 트랜잭션 설계와 중간 상태 노출 문제를 설명한다
    prerequisites: [dist.delivery-semantics, db.transaction]
    practical_cases:
      - 결제 성공 후 재고 확보에 실패했을 때 결제를 취소하는 흐름

  - id: dist.sharding
    name: 샤딩과 파티셔닝
    aliases: [Sharding, 샤딩, Partitioning, 파티셔닝, Consistent Hashing, 일관된 해싱, 샤드 키]
    depth: 2
    summary: 데이터를 키 기준으로 여러 노드나 파티션에 나눠 저장해 용량과 처리량을 늘린다. 샤드 키 선택이 핫스팟과 교차 샤드 조회 비용을 결정한다.
    objectives:
      - 범위 기반과 해시 기반 분할의 차이를 설명한다
      - 샤드 키 선택이 핫스팟과 교차 샤드 쿼리에 미치는 영향을 설명한다
      - 일관된 해싱이 노드 추가 시 재배치를 줄이는 원리를 설명한다
    prerequisites: [db.replication, ds.hash-table]
    practical_cases:
      - 날짜를 샤드 키로 써서 오늘 데이터가 한 노드에 몰린 문제

  - id: dist.consistent-hashing
    name: 일관된 해싱과 가상 노드
    aliases: [Hash Ring, 해시 링, Consistent Hash Ring, Virtual Nodes, 가상 노드, vnode, Rendezvous Hashing, 랑데부 해싱, HRW Hashing]
    depth: 3
    summary: 일관된 해싱은 노드와 키를 같은 해시 링 위에 놓고 키를 시계 방향 다음 노드에 배정해, 노드가 추가·제거될 때 그 주변 키만 옮기게 한다. 노드마다 가상 노드를 여러 개 두어 부하 쏠림을 줄이며, 단순 모듈러 해싱과 달리 증설할 때 대부분의 캐시가 한꺼번에 무효화되지 않는다.
    objectives:
      - hash(key) mod N 방식이 노드 수가 바뀔 때 대부분의 키를 옮기는 이유와 해시 링이 이동량을 약 1/N로 줄이는 원리를 설명한다
      - 가상 노드·복제본 배치·랑데부 해싱 같은 변형이 부하 균형과 장애 시 재분배에 주는 영향을 설명한다
      - 노드별 키 수와 요청량 분포를 보고 가상 노드 수 조정이나 핫 키 별도 처리가 필요한지 판단한다
    prerequisites: [dist.sharding, ds.hash-table]
    practical_cases:
      - 캐시 서버 한 대를 추가했더니 모듈러 분배 때문에 적중률이 급락해 DB가 과부하된 사례
      - 해시 기반 세션 고정을 쓰는 로드밸런서가 백엔드 증설 때 대부분 사용자의 세션을 다른 서버로 옮긴 사례
    doc_links:
      - title: Apache Cassandra - Dynamo (Consistent Hashing using a Token Ring)
        url: https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html
