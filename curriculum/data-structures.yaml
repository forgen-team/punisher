# 자료구조와 알고리즘 — 배열·리스트·해시·스택·큐·트리·그래프·복잡도
area: data-structures
title: 자료구조와 알고리즘
concepts:
  - id: ds.complexity
    name: 시간·공간 복잡도
    aliases: [Big-O, 빅오, Time Complexity, 시간 복잡도, 공간 복잡도, 복잡도]
    depth: 1
    summary: 복잡도는 입력이 커질 때 비용이 어떻게 늘어나는지를 나타낸다. 작은 데이터에서 빠르던 코드가 데이터가 늘면서 갑자기 느려지는 이유를 설명해 준다.
    objectives:
      - O(1)·O(log n)·O(n)·O(n log n)·O(n²)의 증가 차이를 데이터 크기로 설명한다
      - 중첩 반복문과 반복문 안의 조회가 복잡도를 키우는 과정을 설명한다
      - 상수 계수와 실제 데이터 크기가 Big-O보다 중요해지는 경우를 설명한다
    practical_cases:
      - 목록 1천 건에서는 빠르던 중복 제거 로직이 10만 건에서 수 초 걸리는 문제

  - id: ds.array
    name: 배열
    aliases: [Array, 동적 배열, Dynamic Array, 슬라이스, Slice, ArrayList]
    depth: 1
    summary: 배열은 같은 크기의 원소를 연속된 메모리에 담아 인덱스로 즉시 접근한다. 동적 배열은 공간이 부족하면 더 큰 공간으로 복사하며 늘어난다.
    objectives:
      - 인덱스 접근이 O(1)인 이유를 메모리 배치로 설명한다
      - 중간 삽입·삭제가 비싼 이유를 설명한다
      - 동적 배열이 용량을 늘릴 때 복사가 일어나는 과정과 미리 용량을 잡는 이점을 설명한다
    prerequisites: [ds.complexity]
    practical_cases:
      - Go 슬라이스 append에서 용량을 미리 지정해 재할당을 줄인 사례

  - id: ds.linked-list
    name: 연결 리스트
    aliases: [Linked List, LinkedList, 링크드 리스트]
    depth: 1
    summary: 연결 리스트는 노드가 다음 노드를 가리키는 구조로, 삽입·삭제는 싸지만 임의 접근과 캐시 효율이 나쁘다. 실무에서는 LRU 캐시 같은 특정 용도에 쓰인다.
    objectives:
      - 배열과 연결 리스트의 접근·삽입 비용을 비교한다
      - 연결 리스트가 이론상 유리해도 실제로는 느린 경우를 설명한다
    prerequisites: [ds.array]
    practical_cases:
      - LRU 캐시를 해시맵과 이중 연결 리스트로 구현

  - id: ds.hash-table
    name: 해시 테이블
    aliases: [Hash Table, Hash Map, HashMap, 해시맵, 딕셔너리, Dictionary, 해시]
    depth: 1
    summary: 해시 테이블은 키를 해시 함수로 버킷에 배치해 평균 O(1) 조회를 제공한다. 충돌과 재해싱 비용, 순서가 없다는 점을 알고 써야 한다.
    objectives:
      - 해시 함수·버킷·충돌 처리의 원리를 설명한다
      - 평균 O(1)과 최악의 경우, 재해싱 비용을 설명한다
      - 목록 검색을 해시 조회로 바꿔 복잡도를 줄이는 판단을 설명한다
    prerequisites: [ds.array]
    practical_cases:
      - 두 목록 비교를 이중 루프에서 해시 조회로 바꿔 O(n²)를 O(n)으로 개선

  - id: ds.stack
    name: 스택
    aliases: [Stack, LIFO, 콜 스택, Call Stack]
    depth: 1
    summary: 스택은 마지막에 넣은 것을 먼저 꺼내는 구조다. 함수 호출, 되돌리기, 괄호 검사처럼 가장 최근 상태로 돌아가야 하는 문제에 맞다.
    objectives:
      - LIFO 동작과 push·pop 연산을 설명한다
      - 콜 스택이 함수 호출과 재귀를 처리하는 방식과 스택 오버플로를 설명한다
      - 되돌리기 기능이 스택으로 자연스럽게 표현되는 이유를 설명한다
    prerequisites: [ds.array]
    practical_cases:
      - 깊은 재귀 때문에 스택 오버플로가 나는 트리 순회를 반복문으로 바꾸기

  - id: ds.queue
    name: 큐
    aliases: [Queue, FIFO, 대기열]
    depth: 1
    summary: 큐는 먼저 들어온 것을 먼저 처리한다. 작업 대기열, 요청 버퍼, 너비 우선 탐색의 기본 구조다.
    objectives:
      - FIFO 동작과 enqueue·dequeue 연산을 설명한다
      - 작업 대기열에서 큐 길이가 지연과 어떤 관계인지 설명한다
      - 스택과 큐가 서로 다른 순서를 쓰는 이유를 사례로 비교한다
    prerequisites: [ds.array]
    practical_cases:
      - 처리 속도보다 유입이 빨라 대기열이 끝없이 늘어나는 상황 해석

  - id: ds.ring-buffer
    name: 덱과 링 버퍼
    aliases: [Deque, 덱, Ring Buffer, Circular Buffer, 원형 버퍼]
    depth: 2
    summary: 링 버퍼는 고정 크기 배열을 원형으로 써서 메모리 할당 없이 큐를 구현한다. 로그 버퍼나 최근 N개 보관에 쓰인다.
    objectives:
      - 링 버퍼의 head·tail 인덱스 관리 방식을 설명한다
      - 가득 찼을 때 덮어쓰기와 거절 정책의 차이를 설명한다
    prerequisites: [ds.queue]
    practical_cases:
      - 최근 1000개 요청 지연만 유지하는 메트릭 버퍼

  - id: ds.tree
    name: 트리
    aliases: [Tree, 트리 구조, 계층 구조, DOM 트리]
    depth: 1
    summary: 트리는 부모-자식 관계로 계층을 표현한다. 파일 시스템, DOM, 조직도, 카테고리처럼 화면과 데이터의 구조를 나타낸다.
    objectives:
      - 루트·노드·리프·깊이 등 용어와 트리의 성질을 설명한다
      - 전위·후위·레벨 순회의 차이와 용도를 설명한다
      - 계층 데이터를 DB에 저장하는 방법(부모 참조 등)의 장단점을 설명한다
    prerequisites: [ds.linked-list]
    practical_cases:
      - 카테고리 트리를 화면에 그리기 위해 재귀로 펼치기

  - id: ds.binary-search-tree
    name: 이진 탐색 트리
    aliases: [BST, Binary Search Tree, 이진탐색트리]
    depth: 2
    summary: 이진 탐색 트리는 왼쪽은 작고 오른쪽은 큰 값을 두어 정렬된 순서를 유지한다. 균형이 깨지면 연결 리스트처럼 느려진다.
    objectives:
      - 탐색·삽입이 트리 높이에 비례하는 이유를 설명한다
      - 정렬된 입력이 트리를 한쪽으로 치우치게 하는 문제를 설명한다
    prerequisites: [ds.tree, ds.binary-search]
    practical_cases:
      - 범위 조회가 필요한 데이터에 해시맵 대신 정렬된 트리를 선택

  - id: ds.balanced-tree
    name: 균형 트리
    aliases: [Balanced Tree, Red-Black Tree, 레드블랙 트리, AVL 트리]
    depth: 2
    summary: 균형 트리는 삽입·삭제 시 회전으로 높이를 O(log n)으로 유지한다. 언어 표준 라이브러리의 정렬 맵이 이것을 쓴다.
    objectives:
      - 균형 유지가 최악의 경우 성능을 보장하는 원리를 설명한다
      - 정렬 맵(TreeMap 등)과 해시맵의 선택 기준을 설명한다
    prerequisites: [ds.binary-search-tree]
    practical_cases:
      - 시간순 이벤트를 정렬된 상태로 유지하며 범위 조회

  - id: ds.b-tree
    name: B-Tree
    aliases: [B트리, B+Tree, B+트리, 비트리]
    depth: 2
    summary: B-Tree는 노드 하나에 많은 키를 담아 높이를 낮춘 균형 트리로, 디스크 페이지 단위 접근에 맞다. 대부분의 DB 인덱스가 이 구조다.
    objectives:
      - 노드당 키가 많을수록 디스크 접근 횟수가 줄어드는 이유를 설명한다
      - B+Tree의 리프 연결이 범위 조회를 빠르게 하는 원리를 설명한다
      - 인덱스 조회 비용을 트리 높이로 추정한다
    prerequisites: [ds.balanced-tree, arch.storage-devices]
    related: [db.index]
    practical_cases:
      - 1억 행 테이블도 인덱스 조회가 몇 번의 페이지 읽기로 끝나는 이유 설명

  - id: ds.heap-priority-queue
    name: 힙과 우선순위 큐
    aliases: [Heap, Priority Queue, 우선순위 큐, 최소 힙, Min Heap]
    depth: 2
    summary: 힙은 가장 작은(또는 큰) 값을 O(log n)에 꺼내는 구조다. 스케줄러, 타이머, 상위 K개 구하기에 쓰인다.
    objectives:
      - 힙의 삽입·삭제가 O(log n)인 이유를 설명한다
      - 상위 K개 문제를 정렬 대신 힙으로 푸는 이점을 설명한다
      - 우선순위 큐로 작업 스케줄링을 할 때 기아 문제를 설명한다
    prerequisites: [ds.tree, ds.queue]
    practical_cases:
      - 수백만 건 중 점수 상위 100개만 뽑는 집계

  - id: ds.graph
    name: 그래프
    aliases: [Graph, 그래프 구조, 인접 리스트, Adjacency List, DAG, 방향 그래프]
    depth: 1
    summary: 그래프는 노드와 간선으로 관계를 표현한다. 서비스 의존성, 작업 순서, 소셜 관계, 이 학습 지도 자체가 그래프다.
    objectives:
      - 방향·무방향·가중치 그래프와 DAG를 구분한다
      - 인접 리스트와 인접 행렬 표현의 장단점을 설명한다
      - 작업 의존성을 그래프로 모델링하는 방법을 설명한다
    prerequisites: [ds.tree]
    practical_cases:
      - 마이크로서비스 호출 관계를 그래프로 그려 순환 의존을 찾기

  - id: ds.graph-traversal
    name: 그래프 탐색(BFS·DFS)
    aliases: [BFS, DFS, 너비 우선 탐색, 깊이 우선 탐색, Graph Traversal]
    depth: 2
    summary: BFS는 큐로 가까운 노드부터, DFS는 스택(재귀)으로 깊이 먼저 탐색한다. 최단 경로, 연결 여부, 순환 탐지가 모두 이 위에서 동작한다.
    objectives:
      - BFS와 DFS의 동작을 큐·스택과 연결해 설명한다
      - 가중치 없는 최단 경로에 BFS를 쓰는 이유를 설명한다
      - 방문 표시가 없을 때 순환 그래프에서 생기는 문제를 설명한다
    prerequisites: [ds.graph, ds.stack, ds.queue]
    practical_cases:
      - 권한 그룹 상속 관계에서 사용자가 가진 모든 권한 계산

  - id: ds.topological-sort
    name: 위상 정렬
    aliases: [Topological Sort, 위상정렬, 의존성 순서]
    depth: 2
    summary: 위상 정렬은 DAG에서 선행 관계를 지키는 순서를 구한다. 빌드 순서, 마이그레이션 순서, 작업 파이프라인 실행 순서를 정할 때 쓴다.
    objectives:
      - 진입 차수 기반 위상 정렬 과정을 설명한다
      - 순환이 있으면 위상 정렬이 불가능한 이유와 탐지 방법을 설명한다
    prerequisites: [ds.graph-traversal]
    practical_cases:
      - 패키지 빌드 순서를 의존성 그래프로 결정하는 모노레포 도구

  - id: ds.sorting
    name: 정렬
    aliases: [Sorting, 정렬 알고리즘, Quick Sort, Merge Sort, 안정 정렬]
    depth: 1
    summary: 비교 정렬은 O(n log n)이 한계이며, 안정 정렬 여부가 여러 기준 정렬 결과를 좌우한다. 실무에서는 직접 구현보다 특성을 알고 고르는 것이 중요하다.
    objectives:
      - 비교 정렬의 O(n log n) 한계와 대표 알고리즘 특성을 설명한다
      - 안정 정렬이 필요한 상황을 설명한다
      - 메모리에 다 올릴 수 없는 데이터의 외부 정렬 개념을 설명한다
    prerequisites: [ds.complexity, ds.array]
    practical_cases:
      - 날짜순 정렬 뒤 상태순 정렬을 했더니 날짜 순서가 깨지는 문제

  - id: ds.binary-search
    name: 이진 탐색
    aliases: [Binary Search, 이분 탐색]
    depth: 1
    summary: 정렬된 데이터에서 범위를 절반씩 줄여 O(log n)에 찾는다. 경계 조건 실수가 잦고, 답의 범위를 탐색하는 문제에도 쓰인다.
    objectives:
      - 이진 탐색이 정렬을 전제로 하는 이유와 O(log n) 비용을 설명한다
      - lower bound·upper bound 경계 처리를 설명한다
    prerequisites: [ds.sorting]
    practical_cases:
      - git bisect로 버그를 만든 커밋을 찾는 원리

  - id: ds.trie
    name: 트라이
    aliases: [Trie, Prefix Tree, 접두사 트리]
    depth: 2
    summary: 트라이는 문자열을 문자 단위 경로로 저장해 접두사 검색을 빠르게 한다. 자동완성과 라우팅 테이블에 쓰인다.
    objectives:
      - 트라이의 구조와 접두사 검색 비용을 설명한다
      - HTTP 라우터가 경로 매칭에 트리 구조를 쓰는 이유를 설명한다
    prerequisites: [ds.tree]
    practical_cases:
      - 검색창 자동완성 후보를 접두사로 빠르게 찾기

  - id: ds.bloom-filter
    name: 블룸 필터
    aliases: [Bloom Filter, 확률적 자료구조]
    depth: 3
    summary: 블룸 필터는 적은 메모리로 "확실히 없음"을 판정하고 "있을 수도 있음"은 오탐을 허용한다. 비싼 조회를 앞에서 걸러낼 때 쓴다.
    objectives:
      - 여러 해시 함수와 비트 배열로 동작하는 원리를 설명한다
      - 거짓 양성은 있지만 거짓 음성은 없는 이유를 설명한다
    prerequisites: [ds.hash-table]
    practical_cases:
      - 이미 본 URL인지 수억 건을 메모리 몇 MB로 판정하는 크롤러

  - id: ds.amortized-analysis
    name: 분할 상환 분석
    aliases: [Amortized Analysis, 분할상환, 상환 분석]
    depth: 3
    summary: 가끔 비싼 연산이 있어도 전체 평균 비용이 낮으면 분할 상환 O(1)이라 한다. 동적 배열 append와 해시 테이블 재해싱이 대표 예다.
    objectives:
      - 동적 배열 append가 분할 상환 O(1)인 이유를 설명한다
      - 평균 비용은 낮지만 특정 요청의 지연이 튀는 현상을 설명한다
    prerequisites: [ds.complexity, ds.array]
    practical_cases:
      - 큰 맵이 재해싱되는 순간 p99 지연이 튀는 현상

  - id: ds.skip-list
    name: 스킵 리스트
    aliases: [Skip List, Skiplist, 스킵리스트, Sorted Set, 정렬 집합, ZSET]
    depth: 3
    summary: 스킵 리스트는 정렬된 연결 리스트 위에 무작위로 고른 노드만 잇는 여러 층을 얹어 평균 O(log n) 탐색·삽입을 제공한다. 회전 없이 구현이 단순해 Redis 정렬 집합과 여러 LSM 엔진의 memtable에 쓰인다.
    objectives:
      - 노드의 층 높이를 확률로 정하는 방식과 위층에서 아래층으로 내려가며 탐색하는 과정을 설명한다
      - 균형 트리와 비교해 기대 복잡도·최악 경우·동시성 구현 난이도의 차이를 설명한다
      - 순위·범위 조회 요구사항을 보고 Redis 정렬 집합(ZADD·ZRANGE·ZRANK)으로 해결할 수 있는지 판단한다
    prerequisites: [ds.linked-list, ds.balanced-tree]
    practical_cases:
      - 게임 리더보드의 실시간 순위 조회를 Redis 정렬 집합으로 구현한 사례
    doc_links:
      - title: Redis sorted sets
        url: https://redis.io/docs/latest/develop/data-types/sorted-sets/

  - id: ds.cache-eviction-policies
    name: 캐시 교체 정책(LRU·LFU·ARC)
    aliases: [Cache Eviction Policy, Cache Replacement Policy, 캐시 축출 정책, LFU, Least Frequently Used, ARC, Adaptive Replacement Cache, maxmemory-policy]
    depth: 3
    summary: 캐시가 가득 찼을 때 무엇을 버리느냐가 적중률을 결정한다. LRU는 오래 안 쓴 것을, LFU는 적게 쓴 것을 버리고, ARC 같은 적응형 정책은 최근성과 빈도의 비중을 스스로 조절해 일회성 스캔에 캐시가 쓸려 나가는 것을 줄인다.
    objectives:
      - 해시 테이블과 이중 연결 리스트로 O(1) LRU를 구현하는 방식을 설명한다
      - LRU가 순차 스캔에 약하고 LFU가 과거 인기 항목에 묶이는 이유와 ARC·근사 LRU의 절충을 설명한다
      - 적중률과 축출 수 지표(Redis INFO의 keyspace_hits·keyspace_misses·evicted_keys 등)를 읽고 교체 정책이나 캐시 크기를 바꿀지 결정한다
    prerequisites: [ds.hash-table, ds.linked-list, dist.caching]
    practical_cases:
      - 야간 전체 조회 배치가 캐시를 쓸어내 아침 적중률이 급락한 사례
      - TTL 없는 키가 대부분이라 volatile 계열 정책에서 축출할 키가 없어 쓰기 오류가 난 Redis
    doc_links:
      - title: Redis key eviction
        url: https://redis.io/docs/latest/develop/reference/eviction/

  - id: ds.probabilistic-structures
    name: 확률적 자료구조(HyperLogLog·Count-Min Sketch)
    aliases: [HyperLogLog, HLL, 하이퍼로그로그, Count-Min Sketch, 카운트 민 스케치, 고유값 개수 추정, Approximate Counting]
    depth: 3
    summary: 확률적 자료구조는 작은 고정 메모리로 근사 답을 준다. HyperLogLog는 해시값의 앞자리 0의 개수 패턴으로 고유 항목 수를 추정하고, Count-Min Sketch는 여러 해시 카운터의 최솟값으로 항목별 빈도를 과대 추정 방향으로만 틀리게 센다.
    objectives:
      - HyperLogLog가 해시값 패턴으로 고유 항목 수를 추정하는 원리와 오차가 사용하는 메모리에 따라 정해지는 점을 설명한다
      - Count-Min Sketch의 구조와 오차가 과대 추정 한쪽으로만 생기는 이유, 블룸 필터와의 쓰임 차이를 설명한다
      - 정확한 COUNT(DISTINCT)와 근사 추정의 메모리·오차를 비교해 순방문자 집계나 인기 항목 탐지에 근사를 써도 되는지 결정한다
    prerequisites: [ds.hash-table, ds.bloom-filter]
    practical_cases:
      - 일별 순방문자 수를 사용자 ID 집합 대신 Redis HyperLogLog로 집계해 메모리를 크게 줄인 사례
      - 요청 상위 IP를 Count-Min Sketch로 실시간 추적해 레이트 리밋 대상을 고른 사례
    doc_links:
      - title: Redis PFCOUNT
        url: https://redis.io/docs/latest/commands/pfcount/
