area: data-structures
concepts:
    ds.amortized-analysis: 분할 상환 분석은 가끔 비싼 연산이 섞여 있어도 연산 전체의 평균 비용으로 복잡도를 평가하는 방법이다. 동적 배열 append가 대표 예다. 평균은 낮아도 재할당이나 재해싱이 일어나는 순간에는 지연이 튈 수 있다는 점을 함께 알아야 한다.
    ds.array: 배열은 원소를 연속된 메모리에 차례로 놓고 인덱스로 바로 접근하는 자료구조다. 동적 배열은 공간이 모자라면 더 큰 공간으로 옮겨 담으며 커진다. 이 복사 비용 때문에 대량 append 전에 용량을 미리 잡아 두기도 한다.
    ds.b-tree: B-Tree는 노드 하나에 키를 많이 담아 트리 높이를 낮춘 균형 트리로, 디스크를 페이지 단위로 읽는 방식에 맞다. 대부분의 DB 인덱스가 이 구조여서, 큰 테이블도 몇 번의 페이지 읽기로 조회가 끝나는 이유를 설명해 준다.
    ds.balanced-tree: 균형 트리는 삽입·삭제 때 회전 같은 재배치로 높이를 O(log n)으로 유지하는 이진 탐색 트리다. 레드블랙 트리와 AVL 트리가 대표적이다. 정렬된 순서와 범위 조회가 필요할 때 해시맵 대신 쓰는 정렬 맵의 바탕이 된다.
    ds.binary-search: 이진 탐색은 정렬된 데이터에서 가운데 값과 비교해 탐색 범위를 절반씩 줄여 O(log n)에 찾는 방법이다. 경계 조건을 틀리기 쉽다. git bisect처럼 조건이 바뀌는 지점을 찾는 문제에도 같은 원리가 쓰인다.
    ds.binary-search-tree: 이진 탐색 트리는 각 노드의 왼쪽에 더 작은 값, 오른쪽에 더 큰 값을 두어 정렬 순서를 유지하는 트리다. 탐색 비용은 트리 높이에 비례하고, 정렬된 입력이 들어오면 한쪽으로 치우쳐 연결 리스트처럼 느려진다.
    ds.bloom-filter: 블룸 필터는 비트 배열과 여러 해시 함수로 원소가 집합에 있는지 판정하는 확률적 자료구조다. "없다"는 판정은 확실하지만 "있다"는 판정은 틀릴 수 있다. 적은 메모리로 비싼 DB·디스크 조회를 앞에서 걸러낼 때 쓴다.
    ds.complexity: 복잡도는 입력 크기가 커질 때 실행 시간이나 메모리 사용량이 얼마나 빨리 늘어나는지를 Big-O 같은 표기로 나타낸 것이다. 개발 환경의 적은 데이터에서는 문제없던 코드가 운영 데이터에서 갑자기 느려지는 이유를 미리 짚어 준다.
    ds.graph: 그래프는 노드와 노드를 잇는 간선으로 관계를 표현하는 자료구조다. 방향과 가중치를 줄 수 있다. 서비스 호출 관계, 작업 의존성, 권한 상속처럼 트리로는 담기지 않는 관계를 모델링하고 순환 의존을 찾을 때 쓴다.
    ds.graph-traversal: 그래프 탐색은 노드를 빠짐없이 방문하는 방법이다. BFS는 큐를 써서 가까운 노드부터, DFS는 스택이나 재귀를 써서 한 경로를 끝까지 따라간다. 최단 경로, 연결 여부 확인, 순환 탐지가 모두 이 탐색 위에서 동작한다.
    ds.hash-table: 해시 테이블은 키를 해시 함수로 계산해 저장 위치를 정하고, 평균 O(1)에 조회·삽입한다. 이중 루프 비교를 해시 조회로 바꾸는 최적화의 바탕이 된다. 구현에 따라 순서가 보장되지 않고, 충돌과 재해싱 비용이 있다는 점은 알고 써야 한다.
    ds.heap-priority-queue: 힙은 가장 작은 값이나 가장 큰 값이 항상 맨 위에 오도록 유지하는 트리이고, 이것으로 우선순위 큐를 구현한다. 꺼내기와 넣기가 O(log n)이라 타이머, 작업 스케줄러, 상위 K개 집계에 쓰인다.
    ds.linked-list: 연결 리스트는 각 노드가 다음 노드의 주소를 들고 있는 구조다. 삽입·삭제는 싸지만 n번째 원소를 찾으려면 처음부터 따라가야 한다. 메모리가 흩어져 있어 실제로는 배열보다 느린 경우가 많아 LRU 캐시처럼 쓰임새가 분명할 때 고른다.
    ds.queue: 큐는 먼저 들어온 원소를 먼저 꺼내는 FIFO 자료구조다. 작업 대기열, 요청 버퍼, BFS의 기본 구조다. 처리 속도보다 유입 속도가 빠르면 큐가 계속 길어지고 응답 지연도 함께 늘어난다.
    ds.ring-buffer: 링 버퍼는 고정 크기 배열의 끝과 처음을 이어 원형처럼 쓰는 큐로, head·tail 인덱스만 움직여 추가 할당 없이 동작한다. 덱은 양쪽 끝에서 넣고 빼는 큐다. 최근 N개 로그나 메트릭만 남기는 버퍼에 자주 쓰인다.
    ds.sorting: 정렬은 데이터를 기준에 따라 순서대로 늘어놓는 알고리즘으로, 비교 기반 정렬은 최악의 경우 O(n log n)보다 빠를 수 없다. 실무에서는 직접 구현하기보다 안정 정렬인지, 메모리를 얼마나 쓰는지를 보고 고르는 일이 중요하다.
    ds.stack: 스택은 마지막에 넣은 원소를 가장 먼저 꺼내는 LIFO 자료구조다. 함수 호출을 관리하는 콜 스택, 되돌리기 기능, 괄호 짝 검사가 이 구조로 동작한다. 재귀가 너무 깊어지면 스택 오버플로가 나는 이유도 여기서 나온다.
    ds.topological-sort: 위상 정렬은 방향 비순환 그래프에서 모든 선행 관계를 지키도록 노드를 한 줄로 늘어놓는 방법이다. 모노레포 패키지 빌드 순서, 마이그레이션 실행 순서, 파이프라인 단계 순서를 정할 때 쓰며, 순환이 있으면 순서를 만들 수 없다.
    ds.tree: 트리는 하나의 루트에서 부모-자식 관계로 뻗어 나가고 순환이 없는 계층 구조다. DOM, 파일 시스템, 카테고리, 조직도가 모두 트리이며, 이를 재귀로 펼치거나 DB에 저장하는 방식을 정할 때 이 개념이 필요하다.
    ds.trie: 트라이는 문자열을 한 글자씩 트리 경로로 저장해, 같은 접두사를 가진 문자열이 같은 경로를 공유하는 구조다. 검색어 자동완성이나 HTTP 라우터의 경로 매칭처럼 접두사로 빠르게 찾아야 하는 곳에 쓰인다.
terms:
    - id: g.hash-collision
      name: 해시 충돌
      aliases:
        - Hash Collision
        - 충돌
      concept: ds.hash-table
      gloss: 해시 충돌은 서로 다른 키가 같은 버킷 위치로 계산되는 현상이다. 충돌이 많으면 해시 테이블의 조회가 O(1)에서 점점 느려진다.
    - id: g.separate-chaining
      name: 체이닝
      aliases:
        - Separate Chaining
        - 분리 연결법
      concept: ds.hash-table
      gloss: 체이닝은 같은 버킷에 충돌한 원소들을 리스트 등으로 이어 붙여 저장하는 충돌 처리 방식이다. 한 버킷에 원소가 몰리면 그 리스트를 차례로 훑어야 해서 느려진다.
    - id: g.open-addressing
      name: 개방 주소법
      aliases:
        - Open Addressing
        - 선형 탐사
        - Linear Probing
      concept: ds.hash-table
      gloss: 개방 주소법은 충돌이 나면 배열 안의 다른 빈 칸을 규칙에 따라 찾아 저장하는 충돌 처리 방식이다. 테이블이 차오를수록 빈 칸을 찾는 횟수가 늘어난다.
    - id: g.load-factor
      name: 로드 팩터
      aliases:
        - Load Factor
        - 적재율
      concept: ds.hash-table
      gloss: 로드 팩터는 해시 테이블에 저장된 원소 수를 버킷 수로 나눈 값이다. 이 값이 기준을 넘으면 충돌이 잦아지므로 테이블을 키우는 재해싱이 일어난다.
    - id: g.rehashing
      name: 재해싱
      aliases:
        - Rehashing
        - 리해싱
        - 리사이즈
      concept: ds.amortized-analysis
      gloss: 재해싱은 해시 테이블을 더 큰 크기로 늘리면서 기존 원소를 모두 새 위치로 다시 배치하는 작업이다. 평소에는 드물지만 큰 맵에서 일어나면 그 순간 지연이 튈 수 있다.
    - id: g.capacity
      name: 용량
      aliases:
        - Capacity
      concept: ds.array
      gloss: 용량은 동적 배열이 재할당 없이 담을 수 있는 원소 수로, 현재 원소 수인 길이와는 다르다. 들어갈 개수를 미리 알면 용량을 지정해 복사 횟수를 줄일 수 있다.
    - id: g.pointer
      name: 포인터
      aliases:
        - Pointer
        - 참조
        - Reference
      concept: ds.linked-list
      gloss: 포인터는 값 자체가 아니라 값이 있는 메모리 주소를 담는 변수다. 연결 리스트와 트리는 노드끼리 포인터로 이어지므로, 포인터를 따라갈 때 메모리 접근이 흩어진다.
    - id: g.node
      name: 노드
      aliases:
        - Node
        - 정점
        - Vertex
      concept: ds.tree
      gloss: 노드는 연결 리스트·트리·그래프를 이루는 기본 단위로, 값과 다른 노드로의 연결 정보를 함께 가진다. 자료구조의 비용을 따질 때 노드를 몇 번 방문하는지를 기준으로 삼는다.
    - id: g.lru
      name: LRU
      aliases:
        - Least Recently Used
        - LRU 캐시
        - LRU Cache
      concept: ds.linked-list
      gloss: LRU는 가장 오랫동안 쓰이지 않은 항목부터 내보내는 캐시 교체 정책이다. 해시맵으로 항목을 찾고 이중 연결 리스트로 사용 순서를 관리하는 방식으로 흔히 구현한다.
    - id: g.recursion
      name: 재귀
      aliases:
        - Recursion
        - 재귀 함수
        - Recursive
      concept: ds.stack
      gloss: 재귀는 함수가 더 작은 문제로 자기 자신을 다시 호출하는 방식이다. 트리나 중첩 댓글처럼 계층을 펼칠 때 자연스럽지만, 호출마다 콜 스택이 쌓여 깊이에 한계가 있다.
    - id: g.stack-overflow
      name: 스택 오버플로
      aliases:
        - Stack Overflow
        - Maximum call stack size exceeded
      concept: ds.stack
      gloss: 스택 오버플로는 함수 호출이 너무 깊어져 콜 스택에 할당된 공간을 넘는 오류다. 깊은 재귀나 종료 조건이 빠진 재귀에서 나며, 반복문과 명시적 스택으로 바꿔 해결한다.
    - id: g.tree-traversal
      name: 트리 순회
      aliases:
        - Tree Traversal
        - 전위 순회
        - 후위 순회
        - 중위 순회
      concept: ds.tree
      gloss: 트리 순회는 트리의 모든 노드를 정해진 순서로 한 번씩 방문하는 방법이다. 부모를 먼저 처리할지 자식을 먼저 처리할지에 따라 메뉴 렌더링, 폴더 크기 합산처럼 쓰임새가 달라진다.
    - id: g.leaf-node
      name: 리프 노드
      aliases:
        - Leaf
        - Leaf Node
        - 단말 노드
      concept: ds.tree
      gloss: 리프 노드는 자식이 없는 트리의 끝 노드다. B+Tree에서는 실제 데이터 위치가 리프에 모이고 리프끼리 이어져 있어 범위 조회가 빨라진다.
    - id: g.tree-height
      name: 트리 높이
      aliases:
        - Tree Height
        - 트리 깊이
        - Depth
      concept: ds.balanced-tree
      gloss: 트리 높이는 루트에서 가장 먼 리프까지 거치는 단계 수다. 탐색 트리의 조회 비용은 높이에 비례하므로, 높이를 낮게 유지하는 것이 성능의 핵심이 된다.
    - id: g.tree-rotation
      name: 트리 회전
      aliases:
        - Rotation
        - 회전
      concept: ds.balanced-tree
      gloss: 트리 회전은 정렬 순서는 그대로 두고 부모와 자식 노드의 위치를 맞바꿔 트리 모양을 재배치하는 연산이다. 균형 트리는 삽입·삭제 뒤 회전으로 한쪽 쏠림을 바로잡는다.
    - id: g.sorted-map
      name: 정렬 맵
      aliases:
        - Sorted Map
        - TreeMap
        - Ordered Map
      concept: ds.balanced-tree
      gloss: 정렬 맵은 키를 정렬된 순서로 유지하는 맵으로, 보통 균형 트리로 구현한다. 조회는 해시맵보다 느리지만 범위 조회나 순서대로 꺼내기가 필요할 때 쓴다.
    - id: g.range-query
      name: 범위 조회
      aliases:
        - Range Query
        - 범위 검색
        - Range Scan
      concept: ds.b-tree
      gloss: 범위 조회는 특정 값 하나가 아니라 구간 안의 값을 모두 찾는 조회다. 기간별 주문 조회가 대표 예다. 해시 구조는 이를 효율적으로 처리하지 못해 정렬된 트리나 B+Tree 인덱스를 쓴다.
    - id: g.fanout
      name: 팬아웃
      aliases:
        - Fanout
        - 분기 계수
        - Branching Factor
      concept: ds.b-tree
      gloss: 팬아웃은 트리의 노드 하나가 가질 수 있는 자식 수다. 팬아웃이 클수록 트리 높이가 낮아져, B-Tree는 적은 디스크 읽기로 많은 키 중에서 원하는 것을 찾는다.
    - id: g.page-split
      name: 페이지 분할
      aliases:
        - Page Split
        - 노드 분할
        - Node Split
      concept: ds.b-tree
      gloss: 페이지 분할은 B-Tree 노드가 가득 찬 상태에서 키를 넣을 때 노드를 둘로 나누는 작업이다. 무작위 키를 넣으면 분할이 잦아져 인덱스 쓰기 비용과 크기가 늘어날 수 있다.
    - id: g.top-k
      name: 상위 K개
      aliases:
        - Top-K
        - Top K
      concept: ds.heap-priority-queue
      gloss: 상위 K개는 전체 데이터 중 점수가 높은 K개만 골라내는 문제다. 크기 K인 힙을 유지하면 전체를 정렬하지 않아도 되어 메모리와 시간을 아낄 수 있다.
    - id: g.starvation
      name: 기아
      aliases:
        - Starvation
        - 기아 상태
      concept: ds.heap-priority-queue
      gloss: 기아는 우선순위가 낮은 작업이 높은 작업에 계속 밀려 무기한 처리되지 못하는 현상이다. 오래 기다린 작업의 우선순위를 올리는 방식으로 완화한다.
    - id: g.backpressure
      name: 백프레셔
      aliases:
        - Backpressure
        - 배압
      concept: ds.queue
      gloss: 백프레셔는 소비 측이 감당하지 못할 때 생산 측에 속도를 늦추라고 신호를 보내는 흐름 제어다. 이것이 없으면 생산이 소비보다 빠를 때 큐가 계속 길어져 메모리 부족이나 큰 지연으로 이어질 수 있다.
    - id: g.adjacency-matrix
      name: 인접 행렬
      aliases:
        - Adjacency Matrix
      concept: ds.graph
      gloss: 인접 행렬은 노드 수 크기의 2차원 표에 두 노드 사이에 간선이 있는지를 기록하는 그래프 표현이다. 연결 여부는 바로 확인되지만, 간선이 적은 그래프에서는 메모리 낭비가 크다.
    - id: g.cycle
      name: 사이클
      aliases:
        - Cycle
        - 순환
        - 순환 탐지
        - Cycle Detection
      concept: ds.graph-traversal
      gloss: 사이클은 간선을 따라가다 출발한 노드로 다시 돌아오는 경로다. 의존성 그래프에 사이클이 있으면 실행 순서를 정할 수 없고, 방문 표시 없이 탐색하면 무한 루프에 빠진다.
    - id: g.shortest-path
      name: 최단 경로
      aliases:
        - Shortest Path
        - 다익스트라
        - Dijkstra
      concept: ds.graph-traversal
      gloss: 최단 경로는 두 노드 사이를 가장 적은 비용으로 잇는 경로다. 가중치가 없으면 BFS로, 음수가 아닌 가중치가 있으면 다익스트라 같은 알고리즘으로 구한다.
    - id: g.in-degree
      name: 진입 차수
      aliases:
        - In-degree
        - 인디그리
      concept: ds.topological-sort
      gloss: 진입 차수는 어떤 노드로 들어오는 간선의 수, 즉 그 노드가 기다려야 하는 선행 작업의 수다. 위상 정렬은 진입 차수가 0인 노드부터 하나씩 처리하며 순서를 만든다.
    - id: g.external-sort
      name: 외부 정렬
      aliases:
        - External Sort
        - 외부 병합 정렬
      concept: ds.sorting
      gloss: 외부 정렬은 메모리에 다 올릴 수 없는 큰 데이터를 조각으로 나눠 정렬한 뒤 디스크에서 병합하는 방법이다. DB가 큰 결과를 정렬할 때 임시 파일을 쓰는 이유가 여기 있다.
    - id: g.lower-upper-bound
      name: lower bound·upper bound
      aliases:
        - Lower Bound
        - Upper Bound
        - 하한
        - 상한
      concept: ds.binary-search
      gloss: lower bound는 정렬된 데이터에서 값이 처음으로 기준 이상이 되는 위치, upper bound는 처음으로 기준을 넘는 위치다. 중복 값의 개수나 구간 경계를 구할 때 쓴다.
    - id: g.off-by-one
      name: off-by-one 오류
      aliases:
        - Off-by-one
        - 경계 오류
        - 하나 차이 오류
      concept: ds.binary-search
      gloss: off-by-one 오류는 반복 범위나 인덱스 경계를 하나 넘기거나 모자라게 잡는 실수다. 이진 탐색, 페이지 계산, 배열 끝 처리에서 특히 자주 나온다.
    - id: g.false-positive
      name: 거짓 양성
      aliases:
        - False Positive
        - 오탐
      concept: ds.bloom-filter
      gloss: 거짓 양성은 실제로는 없는데 있다고 잘못 판정하는 결과다. 블룸 필터는 거짓 양성을 허용하는 대신 메모리를 아끼며, 비트 배열이 찰수록 오탐 비율이 올라간다.
    - id: g.memoization
      name: 메모이제이션
      aliases:
        - Memoization
        - 메모화
      concept: ds.complexity
      gloss: 메모이제이션은 같은 입력에 대한 계산 결과를 저장해 두고 다시 계산하지 않는 기법이다. 하위 문제가 반복되는 재귀에 적용하면 지수 시간이던 계산을 다항 시간으로 줄일 수 있다.
    - id: g.worst-case
      name: 최악의 경우
      aliases:
        - Worst Case
        - 평균 경우
        - Average Case
      concept: ds.complexity
      gloss: 최악의 경우는 가장 불리한 입력에서 드는 비용이고, 평균 경우는 일반적인 입력에서 기대되는 비용이다. 해시 테이블처럼 평균은 빨라도 최악에는 느린 구조가 있어 둘을 구분해야 한다.
    - id: g.constant-factor
      name: 상수 계수
      aliases:
        - Constant Factor
      concept: ds.complexity
      gloss: 상수 계수는 Big-O 표기에서 생략되는 고정 배수 비용이다. 데이터가 작거나 메모리 접근 패턴이 다르면 복잡도가 같거나 더 나쁜 알고리즘이 실제로는 더 빠를 수 있다.
