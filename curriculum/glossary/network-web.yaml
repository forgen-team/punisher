area: network-web
concepts:
    net.cookie-and-session: 쿠키는 서버가 Set-Cookie로 내려 주면 브라우저가 이후 요청에 자동으로 붙여 보내는 작은 데이터이고, 세션은 이를 식별자로 삼아 서버가 사용자 상태를 유지하는 방식이다. 쿠키 속성 설정이 로그인 공유와 보안을 좌우한다.
    net.cors: CORS는 다른 출처로 보낸 요청의 응답을 브라우저가 읽어도 되는지 서버가 헤더로 허용하는 규약이다. 브라우저만 적용하는 규칙이라서 서버 간 호출에는 영향이 없고, 배포 후 프런트엔드 도메인이 바뀌면 자주 문제가 된다.
    net.dns: DNS는 도메인 이름을 IP 주소 등의 레코드로 바꿔 주는 분산 조회 시스템이다. 조회 결과가 TTL 동안 여러 단계에 캐시되므로, 서버를 옮긴 뒤 일부 사용자가 한동안 옛 주소로 접속하는 일이 생긴다.
    net.http: HTTP는 클라이언트가 요청을 보내고 서버가 응답하는 방식으로 자원을 주고받는 무상태 프로토콜이다. 메서드의 안전성·멱등성과 헤더가 캐시, 재시도, 크롤러 동작을 좌우한다.
    net.http-caching-cdn: HTTP 캐싱은 응답 헤더에 따라 브라우저나 중간 서버가 응답을 저장해 다시 쓰는 것이고, CDN은 사용자 가까운 곳에 캐시 서버를 둔 네트워크다. 설정이 잘못되면 배포 후에도 옛 화면이 보이거나 개인 응답이 남에게 노출된다.
    net.http-status-codes: 상태 코드는 HTTP 응답의 결과를 세 자리 숫자로 분류한 것이다. 2xx는 성공, 4xx는 클라이언트 오류, 5xx는 서버 오류를 뜻한다. 502·503·504는 프록시와 백엔드 중 어느 구간에서 실패했는지 알려 주는 단서다.
    net.http2-http3: HTTP/2는 하나의 TCP 연결에서 여러 요청을 동시에 주고받는 다중화를 도입한 버전이고, HTTP/3는 UDP 기반 QUIC 위에서 동작한다. 연결 수와 패킷 손실 영향이 달라져 로드밸런서와 성능 특성에도 차이가 생긴다.
    net.ip-and-routing: IP 주소는 네트워크에서 호스트의 위치를 나타내는 번호이고, 라우팅은 패킷이 목적지까지 갈 다음 경로를 정하는 일이다. 클라우드 VPC·서브넷·피어링 설정은 모두 CIDR 대역과 라우팅 테이블로 표현된다.
    net.keepalive-connection-reuse: 한 번 맺은 TCP 연결을 닫지 않고 다음 요청에 다시 쓰는 방식이다. 핸드셰이크 비용을 줄여 주지만, 서버가 먼저 닫은 유휴 연결을 클라이언트가 재사용하면 간헐적인 connection reset 오류가 난다.
    net.load-balancer: 로드밸런서는 여러 서버 인스턴스에 요청을 나눠 보내고, 헬스 체크에 실패한 대상은 분배에서 제외하는 장치다. L4는 연결 단위로, L7은 HTTP 요청 단위로 분배한다. 배포 중 502가 나는 문제와 직결된다.
    net.nat-and-ports: 포트는 한 호스트 안에서 통신 상대 프로세스를 구분하는 번호이고, NAT는 사설 주소와 포트를 공인 주소와 포트로 바꿔 주는 기능이다. 도커 포트 매핑이나 내부망 서버가 외부에서 안 보이는 문제가 이 원리로 설명된다.
    net.network-layers: 네트워크 통신을 물리·링크·IP·전송·애플리케이션처럼 역할별 층으로 나눠 설명하는 틀이다. 각 층은 아래 층의 기능을 이용하고 위 층에 서비스를 제공한다. 장애가 났을 때 어느 층의 문제인지 가설을 세우면 원인 범위가 빨리 좁혀진다.
    net.realtime-push: WebSocket은 양방향 지속 연결을, SSE는 서버에서 클라이언트로 가는 단방향 이벤트 스트림을 제공하는 기술이다. 실시간 알림이나 진행 상황 표시에 쓰이며, 프록시 버퍼링과 유휴 타임아웃 설정에 따라 연결이 끊기거나 지연된다.
    net.request-path: 요청 하나가 DNS 조회, TCP 연결, TLS 핸드셰이크, HTTP 요청·응답, 서버 처리를 차례로 거치는 전체 경로다. 느리거나 실패한 요청을 진단할 때는 어느 구간에서 시간이 걸렸는지부터 측정한다.
    net.rest-api-design: REST API 설계는 자원을 URL로, 행위를 HTTP 메서드로, 결과를 상태 코드로 표현하는 API 작성 방식이다. 오류 형식과 상태 코드가 일관되어야 클라이언트 처리와 모니터링이 실패를 제대로 구분한다.
    net.retry-and-backoff: 재시도는 일시적으로 실패한 요청을 다시 보내는 것이고, 백오프는 재시도 간격을 점점 늘리는 방식이다. 지터 없이 동시에 재시도하면 복구 직후 부하가 몰려 다시 장애가 나고, 멱등하지 않은 요청은 중복 처리될 수 있다.
    net.reverse-proxy: 리버스 프록시는 서버 앞에서 클라이언트 요청을 받아 백엔드로 전달하는 중계 서버다. TLS 종료, 경로 라우팅, 업로드 크기 제한을 맡으며, 원래 클라이언트 IP는 X-Forwarded-For 같은 헤더로 전달된다.
    net.tcp: TCP는 순서 보장·재전송·흐름 제어로 신뢰성 있는 바이트 스트림을 제공하는 전송 프로토콜이다. 대부분의 HTTP·DB 연결이 TCP 위에서 동작하며, 패킷 손실은 오류보다 지연으로 나타나는 경우가 많다.
    net.tcp-connection-states: TCP 연결이 핸드셰이크로 열리고 FIN 교환으로 닫히는 동안 거치는 상태들의 모음이다. 서버에 TIME_WAIT나 CLOSE_WAIT이 대량으로 쌓이면 연결을 너무 자주 만들거나 애플리케이션이 연결을 닫지 않는다는 신호다.
    net.timeouts: 타임아웃은 연결이나 응답을 기다리는 최대 시간을 정해 넘기면 포기하게 하는 설정이다. 타임아웃이 없으면 느린 외부 API 하나가 스레드와 연결을 모두 붙잡아 서버 전체가 멈출 수 있다.
    net.tls: TLS는 인증서로 서버를 확인하고 키를 합의해 통신을 암호화하는 프로토콜로, HTTPS의 기반이다. 인증서 만료, 도메인 불일치, 중간 인증서 누락이 서버 간 호출 실패의 흔한 원인이다.
    net.udp: UDP는 연결 설정이나 재전송 없이 데이터그램을 바로 보내는 전송 프로토콜이다. 가볍고 빠르지만 손실과 순서 문제는 애플리케이션이 처리해야 한다. DNS와 QUIC이 UDP 위에서 동작한다.
terms:
    - id: g.packet
      name: 패킷
      aliases:
        - Packet
        - 패킷 단위
      concept: net.network-layers
      gloss: 패킷은 네트워크로 전송되는 데이터의 단위로, 헤더와 실제 데이터로 이루어진다. HTTP 요청도 계층을 내려가며 하나 이상의 패킷에 나뉘어 담겨 전송되고, 패킷 손실은 재전송과 지연의 원인이 된다.
    - id: g.icmp
      name: ICMP
      aliases:
        - ping
        - 핑
        - Internet Control Message Protocol
      concept: net.network-layers
      gloss: ICMP는 도달 불가 같은 네트워크 오류와 진단 정보를 전달하는 프로토콜이고, ping은 이를 이용해 상대 호스트의 응답 여부와 왕복 시간을 확인한다. ping이 된다고 해서 특정 포트나 HTTP가 동작한다는 뜻은 아니다.
    - id: g.traceroute
      name: traceroute
      aliases:
        - tracert
        - 경로 추적
      concept: net.ip-and-routing
      gloss: traceroute는 패킷이 목적지까지 거치는 중간 라우터를 차례로 보여 주는 진단 도구다. 특정 구간에서 지연이 커지거나 응답이 끊기는 지점을 찾아 네트워크 경로 문제를 좁힐 때 쓴다.
    - id: g.default-gateway
      name: 기본 게이트웨이
      aliases:
        - Default Gateway
      concept: net.ip-and-routing
      gloss: 기본 게이트웨이는 라우팅 테이블에 맞는 경로가 없을 때 패킷을 넘기는 라우터다. 별도 경로가 없는 서브넷 밖 트래픽은 모두 여기를 거치므로, 설정이 틀리면 내부 통신은 되는데 외부 접속만 실패한다.
    - id: g.vpc
      name: VPC
      aliases:
        - Virtual Private Cloud
        - 가상 사설 클라우드
      concept: net.ip-and-routing
      gloss: VPC는 클라우드 안에서 논리적으로 격리된 사설 네트워크로, 주소 대역과 서브넷, 라우팅을 직접 정한다. 서버와 DB를 어느 서브넷에 두는지가 외부 노출 범위와 서비스 간 통신 가능 여부를 결정한다.
    - id: g.mtu
      name: MTU
      aliases:
        - Maximum Transmission Unit
        - 최대 전송 단위
      concept: net.ip-and-routing
      gloss: MTU는 한 링크에서 한 번에 보낼 수 있는 패킷의 최대 크기다. 터널이나 VPN을 거치며 경로상 MTU가 작아졌는데 경로 MTU 탐색이 막혀 있으면, 작은 요청은 되는데 큰 응답만 멈추는 현상이 생길 수 있다.
    - id: g.firewall
      name: 방화벽
      aliases:
        - Firewall
        - iptables
      concept: net.nat-and-ports
      gloss: 방화벽은 주소·포트·프로토콜 규칙에 따라 트래픽을 허용하거나 차단하는 장치나 소프트웨어다. 서버 프로세스는 정상인데 외부에서 접속이 거부되거나 타임아웃이 날 때 먼저 확인할 대상 중 하나다.
    - id: g.security-group
      name: 보안 그룹
      aliases:
        - Security Group
        - SG
      concept: net.nat-and-ports
      gloss: 보안 그룹은 클라우드 인스턴스 단위로 허용할 인바운드·아웃바운드 트래픽을 정하는 가상 방화벽 규칙이다. 포트를 열지 않으면 연결 시도가 응답 없이 타임아웃으로 끝나는 경우가 많다.
    - id: g.ephemeral-port
      name: 임시 포트
      aliases:
        - Ephemeral Port
        - 에페메랄 포트
        - 클라이언트 포트
      concept: net.nat-and-ports
      gloss: 임시 포트는 클라이언트가 연결을 맺을 때 운영체제가 자동으로 골라 주는 출발지 포트다. 짧은 연결을 대량으로 만들면 TIME_WAIT 상태와 맞물려 임시 포트가 바닥나 새 연결이 실패할 수 있다.
    - id: g.localhost
      name: localhost
      aliases:
        - 루프백
        - Loopback
        - 127.0.0.1
      concept: net.nat-and-ports
      gloss: localhost는 자기 자신을 가리키는 루프백 주소로, 여기에만 바인딩한 서버는 같은 호스트 안에서만 접속할 수 있다. 컨테이너 안 서버가 127.0.0.1에만 리슨하면 포트를 매핑해도 외부에서 접속되지 않는다.
    - id: g.dns-resolver
      name: 리졸버
      aliases:
        - Resolver
        - DNS 리졸버
        - 재귀 리졸버
        - Recursive Resolver
      concept: net.dns
      gloss: 리졸버는 클라이언트를 대신해 여러 DNS 서버를 거쳐 이름을 조회하고 결과를 캐시하는 서버다. 어떤 리졸버를 쓰느냐에 따라 같은 도메인도 다른 시점의 결과를 받을 수 있다.
    - id: g.hosts-file
      name: hosts 파일
      aliases:
        - /etc/hosts
        - hosts
      concept: net.dns
      gloss: hosts 파일은 도메인과 IP의 대응을 로컬에 직접 적어 두는 파일로, 보통 DNS 조회보다 먼저 참조된다. 테스트용으로 넣어 둔 항목을 잊으면 그 컴퓨터에서만 엉뚱한 서버로 접속하는 원인이 된다.
    - id: g.dig
      name: dig
      aliases:
        - nslookup
        - DNS 조회 도구
      concept: net.dns
      gloss: dig는 DNS 레코드를 직접 조회해 응답 내용과 남은 TTL을 보여 주는 명령줄 도구다. 도메인 변경이 반영됐는지, 특정 DNS 서버가 어떤 값을 돌려주는지 확인할 때 쓴다.
    - id: g.syn
      name: SYN
      aliases:
        - SYN 패킷
        - SYN-ACK
      concept: net.tcp-connection-states
      gloss: SYN은 TCP 연결을 시작하자고 요청하는 플래그이고, 서버는 SYN-ACK로 답한다. SYN을 보냈는데 응답이 없으면 연결 타임아웃이 나고, 방화벽 차단이나 서버 과부하를 의심한다.
    - id: g.rst
      name: RST
      aliases:
        - TCP Reset
        - connection reset by peer
        - ECONNRESET
      concept: net.tcp-connection-states
      gloss: RST는 TCP 연결을 정상 종료 절차 없이 즉시 끊는 플래그다. 이미 닫힌 연결에 데이터를 보내거나 프로세스가 갑자기 죽으면 발생할 수 있으며, 애플리케이션에는 connection reset 오류로 보인다.
    - id: g.connection-refused
      name: Connection refused
      aliases:
        - ECONNREFUSED
        - 연결 거부
      concept: net.request-path
      gloss: Connection refused는 대상 호스트에는 도달했지만 해당 포트에서 리슨하는 프로세스가 없어 연결이 즉시 거부된 상태다. 응답 없이 기다리다 끝나는 타임아웃과 달리 서버 프로세스 미기동이나 잘못된 포트를 뜻하는 경우가 많다.
    - id: g.congestion-control
      name: 혼잡 제어
      aliases:
        - Congestion Control
        - 슬로 스타트
        - Slow Start
      concept: net.tcp
      gloss: 혼잡 제어는 TCP가 네트워크 상태를 보고 한 번에 보낼 데이터 양을 조절하는 메커니즘이다. 새 연결은 처음에 적게 보내다가 점차 늘리므로, 연결을 재사용하지 않으면 큰 응답 전송이 느려진다.
    - id: g.hol-blocking
      name: Head-of-line 블로킹
      aliases:
        - HOL Blocking
        - HOL 블로킹
        - 헤드 오브 라인 블로킹
      concept: net.http2-http3
      gloss: Head-of-line 블로킹은 앞선 데이터 하나가 지연되면 뒤에 줄 선 데이터까지 모두 기다리는 현상이다. HTTP/2처럼 한 TCP 연결에 여러 스트림을 실으면 패킷 하나만 손실돼도 모든 스트림이 멈추며, HTTP/3는 QUIC으로 이를 줄인다.
    - id: g.curl
      name: curl
      aliases:
        - curl -v
        - curl -w
      concept: net.request-path
      gloss: curl은 명령줄에서 HTTP 요청을 보내고 응답을 확인하는 도구다. 상세 출력으로 헤더와 TLS 과정을 보고, 출력 형식 옵션으로 DNS·연결·TLS·첫 바이트까지의 구간별 시간을 측정할 수 있다.
    - id: g.ss
      name: ss
      aliases:
        - netstat
        - 소켓 상태 조회
      concept: net.tcp-connection-states
      gloss: ss는 리눅스에서 열린 소켓과 TCP 연결 상태를 나열하는 명령줄 도구다. 어떤 포트에 리슨 중인지, ESTABLISHED·TIME_WAIT·CLOSE_WAIT 연결이 몇 개인지 확인해 연결 누수를 찾는다.
    - id: g.tcpdump
      name: tcpdump
      aliases:
        - 패킷 캡처
        - Packet Capture
        - Wireshark
      concept: net.network-layers
      gloss: tcpdump는 네트워크 인터페이스를 지나는 패킷을 캡처해 보여 주는 도구다. 애플리케이션 로그로는 보이지 않는 핸드셰이크 실패, RST 발생, 재전송 여부를 실제 패킷으로 확인할 때 쓴다.
    - id: g.sni
      name: SNI
      aliases:
        - Server Name Indication
        - 서버 이름 표시
      concept: net.tls
      gloss: SNI는 TLS 핸드셰이크 초반에 클라이언트가 접속하려는 도메인 이름을 서버에 알려 주는 확장이다. 한 IP에서 여러 도메인을 서비스할 때 서버가 이를 보고 맞는 인증서를 고르므로, 빠지면 기본 인증서가 돌아와 도메인 불일치 오류가 날 수 있다.
    - id: g.san
      name: SAN
      aliases:
        - Subject Alternative Name
        - 주체 대체 이름
      concept: net.tls
      gloss: SAN은 인증서가 유효한 도메인 이름 목록을 담는 필드다. 접속한 호스트 이름이 SAN에 없으면 인증서가 유효해도 도메인 불일치 오류가 나며, 와일드카드나 서브도메인 추가 시 자주 문제가 된다.
    - id: g.upstream
      name: 업스트림
      aliases:
        - Upstream
        - upstream server
        - 오리진 서버
        - Origin Server
      concept: net.reverse-proxy
      gloss: 업스트림은 프록시나 CDN이 요청을 넘겨 실제 응답을 받아 오는 뒤쪽 서버를 가리킨다. nginx 오류 로그에서 upstream 관련 메시지는 백엔드 연결 실패나 응답 지연을 뜻하는 경우가 많다.
    - id: g.connection-draining
      name: 연결 드레이닝
      aliases:
        - Connection Draining
        - Deregistration Delay
        - Graceful Drain
      concept: net.load-balancer
      gloss: 연결 드레이닝은 종료될 서버를 분배 대상에서 먼저 빼고, 처리 중인 요청이 끝날 때까지 기다린 뒤 내리는 절차다. 이것이 없으면 배포나 축소 때 진행 중인 요청이 끊겨 502 같은 오류가 날 수 있다.
    - id: g.sticky-session
      name: 스티키 세션
      aliases:
        - Sticky Session
        - Session Affinity
        - 세션 고정
      concept: net.load-balancer
      gloss: 스티키 세션은 같은 클라이언트의 요청을 계속 같은 서버로 보내도록 로드밸런서를 설정하는 방식이다. 서버 메모리에 세션을 둘 때 쓰이지만, 서버가 내려가면 세션이 사라지고 부하가 고르게 분산되지 않을 수 있다.
    - id: g.vary
      name: Vary 헤더
      aliases:
        - Vary
        - Vary Header
      concept: net.http-caching-cdn
      gloss: Vary는 어떤 요청 헤더 값에 따라 응답이 달라지는지 캐시에 알려 주는 응답 헤더다. 언어나 압축 방식별로 응답이 다른데 Vary를 빠뜨리면 CDN이 다른 사용자에게 맞지 않는 응답을 돌려줄 수 있다.
    - id: g.chunked
      name: Chunked 전송
      aliases:
        - Transfer-Encoding chunked
        - 청크 인코딩
        - Chunked Transfer Encoding
      concept: net.realtime-push
      gloss: Chunked 전송은 HTTP/1.1에서 전체 길이를 미리 알리지 않고 응답 본문을 조각 단위로 이어 보내는 방식이다. 스트리밍 응답에 쓰이지만 중간 프록시가 버퍼링하면 조각이 모였다가 한꺼번에 도착한다.
