area: os
concepts:
    os.atomic-and-cas: 원자적 연산은 중간에 다른 흐름이 끼어들 수 없는 한 번의 연산이고, CAS는 값이 예상과 같을 때만 새 값으로 바꾸는 원자적 명령이다. 카운터처럼 단순한 공유 값은 락 없이 안전하게 갱신할 수 있다.
    os.cgroups: cgroups는 프로세스 묶음이 쓰는 CPU, 메모리, I/O를 제한하고 측정하는 리눅스 커널 기능이다. 컨테이너의 CPU·메모리 limit이 이것으로 구현되므로, 주기적인 지연 급증이나 OOM 종료를 해석할 때 출발점이 된다.
    os.context-switch: 컨텍스트 스위치는 CPU가 실행 중인 스레드를 다른 스레드로 바꾸면서 레지스터와 상태를 저장하고 복원하는 작업이다. 전환마다 비용이 들고 캐시 효율도 떨어지므로, 스레드를 과도하게 늘리면 오히려 처리량이 줄어든다.
    os.deadlock: 교착 상태는 둘 이상의 흐름이 서로가 쥔 자원을 기다리느라 아무도 진행하지 못하는 상태다. 에러 없이 요청이 멈추는 형태로 나타나며, 락을 잡는 순서를 통일하거나 타임아웃을 두는 것이 실무적인 예방책이다.
    os.ebpf-tracing: eBPF는 검증된 작은 프로그램을 커널 이벤트에 붙여 실행하는 리눅스 기능이다. 앱을 고치거나 재시작하지 않고 운영 중인 서버의 시스템 콜·디스크·스케줄링 지연을 낮은 부담으로 관찰할 수 있다.
    os.epoll-c10k: C10K는 서버 하나가 만 개 넘는 동시 연결을 다루는 문제다. epoll은 감시할 연결을 커널에 등록해 두고 준비된 것만 돌려받아 연결 수가 많아도 효율적이며, 엣지·레벨 트리거 차이를 알아야 연결이 멈추지 않는다.
    os.event-loop: 이벤트 루프는 I/O 완료 같은 이벤트를 기다렸다가 등록된 콜백을 하나씩 실행하는 단일 스레드 실행 구조다. Node.js 서버가 이 방식이라, 루프를 오래 붙잡는 CPU 작업 하나가 모든 요청의 응답을 늦춘다.
    os.exit-code-and-signals: 종료 코드는 프로세스가 끝날 때 남기는 숫자로 0은 정상, 그 외는 실패를 뜻한다. 시그널은 외부에서 프로세스에 보내는 짧은 통지로 종료 요청이나 강제 종료에 쓰인다. 컨테이너가 137로 끝났다면 SIGKILL로 죽었다는 단서다.
    os.file-descriptor: 파일 디스크립터는 프로세스가 연 파일, 소켓, 파이프를 가리키는 정수 번호다. 프로세스마다 열 수 있는 개수에 한도가 있어서, 응답 본문이나 연결을 닫지 않으면 Too many open files 오류로 새 요청을 받지 못한다.
    os.file-system: 파일 시스템은 디스크 위에 파일과 디렉터리 구조를 만들고 관리하는 방식이다. 파일 메타데이터는 inode에 저장되어 용량이 남아도 inode가 바닥나면 파일을 만들 수 없고, 열린 채 지운 파일은 공간이 회수되지 않는다.
    os.gc-memory-management: 가비지 컬렉션은 더 이상 참조되지 않는 힙 메모리를 런타임이 자동으로 찾아 회수하는 기능이다. 대신 CPU를 쓰고 실행을 잠시 멈추게 할 수 있어 트래픽이 몰릴 때 지연이 튀는 원인이 되며, 할당을 줄이는 것이 우선이다.
    os.io-models: 블로킹 I/O는 데이터가 준비될 때까지 스레드를 멈춰 세우고, 논블로킹 I/O는 즉시 돌아온다. epoll 같은 I/O 멀티플렉싱은 한 스레드가 여러 연결 중 준비된 것만 골라 처리하게 해 대량 동시 연결 서버의 기반이 된다.
    os.kernel-and-syscall: 커널은 하드웨어와 자원을 관리하는 운영체제의 핵심이고, 시스템 콜은 애플리케이션이 커널에 작업을 요청하는 공식 통로다. 파일 읽기, 소켓 연결, 프로세스 생성이 모두 시스템 콜을 거치므로 느린 I/O나 권한 오류를 추적할 때 이 경계를 본다.
    os.memory-allocator-fragmentation: malloc 같은 메모리 할당자는 커널에서 큰 덩어리를 받아 잘게 나눠 준다. 해제한 메모리가 조각난 채 남아 OS로 돌아가지 않으면 RSS가 계속 커 보여, 누수가 없는데도 컨테이너가 메모리 한도에 걸릴 수 있다.
    os.memory-metrics: VSZ, RSS, 워킹셋 같은 메모리 지표는 각자 다른 범위의 메모리를 센다. 대시보드와 top의 숫자가 다른 이유를 설명하고, 어느 숫자가 메모리 제한과 OOM 판단에 쓰이는지 알아야 누수와 캐시를 구분할 수 있다.
    os.memory-oom: OOM은 메모리가 바닥난 상태이고, OOM Killer는 이때 커널이 프로세스를 골라 강제 종료하는 기능이다. 컨테이너가 메모리 제한을 넘으면 앱 로그 없이 종료 코드 137로 죽으므로 커널 로그와 컨테이너 상태에서 원인을 찾는다.
    os.mmap-page-fault: mmap은 파일이나 메모리를 프로세스 주소 공간에 연결하고, 실제 내용은 처음 접근할 때 페이지 폴트로 채운다. 메모리에 이미 있으면 빠르지만 디스크에서 읽어야 하면 크게 느려져 재시작 직후 지연의 원인이 된다.
    os.mutex-and-lock: 락은 임계 구역에 한 번에 정해진 수의 흐름만 들어가도록 막는 동기화 도구이고, 뮤텍스는 그중 하나만 허용하는 락이다. 경쟁 조건을 막아 주지만 대기 비용이 생겨, 락 범위가 넓으면 코어를 늘려도 처리량이 오르지 않는다.
    os.namespaces: 네임스페이스는 프로세스가 보는 PID, 네트워크, 파일 시스템 마운트, 호스트명 등을 따로 분리하는 리눅스 커널 기능이다. 컨테이너 안의 localhost가 호스트의 localhost가 아니고 앱이 PID 1로 보이는 이유가 이것이다.
    os.page-cache: 페이지 캐시는 커널이 디스크 내용을 메모리에 보관해 읽기와 쓰기를 빠르게 하는 장치다. 서버의 free 메모리가 거의 없어도 정상일 수 있는 이유이며, write가 성공해도 fsync 전에는 디스크에 기록되지 않았을 수 있다.
    os.process: 프로세스는 실행 중인 프로그램 하나로, 자기만의 주소 공간과 열린 파일 목록, 환경 변수, PID를 가진다. 서버의 서비스와 컨테이너 안의 앱도 결국 프로세스여서, 포트 점유나 중복 실행 문제를 볼 때 기본 단위가 된다.
    os.process-lifecycle-fork-exec: 유닉스 계열에서 프로세스는 fork로 자신을 복제한 뒤 exec로 다른 프로그램으로 바뀌어 생겨나고, 종료 후 부모가 회수해야 완전히 사라진다. 컨테이너의 PID 1이 시그널 전달과 자식 회수를 맡아야 하는 이유가 여기서 나온다.
    os.race-condition: 경쟁 조건은 여러 실행 흐름이 공유 데이터를 동시에 읽고 쓸 때 실행 순서에 따라 결과가 달라지는 버그다. 조회수가 덜 오르거나 재고가 음수가 되는 문제처럼, 테스트에서는 숨어 있다가 트래픽이 몰릴 때 드러난다.
    os.scheduling: CPU 스케줄링은 커널이 실행 가능한 스레드들 중 누구에게 언제 얼마나 CPU를 줄지 정하는 일이다. load average와 CPU 사용률이 서로 다른 것을 재는 이유, CPU 제한이 지연으로 나타나는 이유를 이해하는 기반이다.
    os.socket: 소켓은 네트워크 통신의 끝점을 파일 디스크립터처럼 다루게 하는 운영체제 인터페이스다. 서버는 주소와 포트에 바인딩한 뒤 listen과 accept로 연결을 받으며, 127.0.0.1에만 바인딩하면 컨테이너 밖에서 접속할 수 없다.
    os.stdout-stderr-logs: 표준 출력과 표준 에러는 모든 프로세스가 기본으로 가진 출력 통로로, 각각 파일 디스크립터 1번과 2번이다. 컨테이너 환경은 이 출력을 모아 로그로 보여 주므로, 강제 종료로 출력이 끊기면 로그 외 증거를 찾아야 한다.
    os.thread: 스레드는 한 프로세스 안에서 메모리를 공유하며 동시에 실행되는 흐름이다. 프로세스를 새로 띄우는 것보다 가볍지만 공유 데이터를 함께 건드리면 버그가 생기고, 스레드 하나의 크래시가 프로세스 전체를 죽일 수 있다.
    os.virtual-memory: 가상 메모리는 각 프로세스에 독립된 주소 공간을 보여 주고, 커널과 하드웨어가 이를 실제 물리 메모리 페이지에 연결하는 방식이다. 프로세스의 가상 메모리 크기는 큰데 실제 사용량은 작은 현상이 이 구조 때문에 생긴다.
terms:
    - id: g.strace
      name: strace
      aliases:
        - 시스템 콜 추적
      concept: os.kernel-and-syscall
      gloss: strace는 리눅스에서 프로세스가 호출하는 시스템 콜과 그 결과를 실시간으로 보여 주는 도구다. 파일 열기 실패나 응답 없이 멈춘 프로세스가 어느 호출에서 막혔는지 확인할 때 쓴다.
    - id: g.errno
      name: errno
      aliases:
        - 에러 번호
        - ENOENT
        - EACCES
      concept: os.kernel-and-syscall
      gloss: errno는 시스템 콜이 실패했을 때 실패 이유를 나타내는 번호다. ENOENT는 파일이 없음, EACCES는 권한 없음을 뜻하며, 에러 메시지에 찍힌 이 이름으로 경로 문제와 권한 문제를 구분한다.
    - id: g.proc-fs
      name: /proc
      aliases:
        - procfs
        - proc 파일 시스템
      concept: os.process
      gloss: /proc은 커널이 프로세스와 시스템 상태를 파일 형태로 보여 주는 가상 파일 시스템이다. 실제 디스크 파일이 아니며, ps나 top 같은 도구도 이곳을 읽어 정보를 표시한다.
    - id: g.ps-top
      name: ps와 top
      aliases:
        - ps
        - top
        - htop
      concept: os.process
      gloss: ps는 현재 프로세스 목록과 상태를 한 번 출력하고, top은 CPU와 메모리 사용량을 실시간으로 갱신해 보여 주는 도구다. 서버에서 어떤 프로세스가 자원을 많이 쓰는지 가장 먼저 확인할 때 쓴다.
    - id: g.ppid
      name: 부모 프로세스
      aliases:
        - PPID
        - Parent Process
      concept: os.process-lifecycle-fork-exec
      gloss: 부모 프로세스는 다른 프로세스를 생성한 프로세스이고, 그 번호를 PPID라 한다. 자식이 종료되면 부모가 종료 상태를 회수해야 하며, 프로세스 트리를 따라가면 누가 무엇을 띄웠는지 알 수 있다.
    - id: g.waitpid
      name: wait·waitpid
      aliases:
        - wait
        - waitpid
        - 자식 회수
      concept: os.process-lifecycle-fork-exec
      gloss: wait와 waitpid는 부모 프로세스가 자식의 종료를 기다리고 종료 상태를 회수하는 시스템 콜이다. 이 호출이 없으면 끝난 자식이 좀비로 남아 프로세스 표의 자리를 계속 차지한다.
    - id: g.sigint
      name: SIGINT
      aliases:
        - Ctrl+C
        - 인터럽트 시그널
      concept: os.exit-code-and-signals
      gloss: SIGINT는 터미널에서 Ctrl+C를 누를 때 프로세스에 전달되는 중단 요청 시그널이다. SIGTERM처럼 프로세스가 가로채 정리 작업을 할 수 있어, 로컬 개발 서버의 종료 처리를 확인할 때 자주 마주친다.
    - id: g.sigsegv
      name: 세그멘테이션 폴트
      aliases:
        - Segmentation Fault
        - SIGSEGV
        - segfault
      concept: os.virtual-memory
      gloss: 세그멘테이션 폴트는 프로세스가 접근 권한이 없거나 매핑되지 않은 메모리 주소에 접근할 때 커널이 SIGSEGV를 보내 종료시키는 현상이다. 네이티브 모듈이나 C 라이브러리 버그로 서버가 갑자기 죽을 때 나타난다.
    - id: g.core-dump
      name: 코어 덤프
      aliases:
        - Core Dump
        - core file
      concept: os.exit-code-and-signals
      gloss: 코어 덤프는 프로세스가 비정상 종료될 때 그 순간의 메모리 상태를 파일로 저장한 것이다. 디버거로 열어 크래시 시점의 호출 흐름과 변수 값을 확인할 수 있어 재현이 어려운 충돌 분석에 쓴다.
    - id: g.thread-pool
      name: 스레드 풀
      aliases:
        - Thread Pool
        - 워커 풀
        - Worker Pool
      concept: os.thread
      gloss: 스레드 풀은 스레드를 미리 정해진 수만큼 만들어 두고 작업을 나눠 맡기는 방식이다. 요청마다 스레드를 새로 만드는 비용을 줄이고 동시 실행 수를 제한하므로, 풀 크기가 처리량과 지연을 좌우한다.
    - id: g.goroutine
      name: 고루틴
      aliases:
        - Goroutine
      concept: os.thread
      gloss: 고루틴은 Go 런타임이 관리하는 가벼운 실행 단위로, 적은 수의 OS 스레드 위에 많은 고루틴을 나눠 실행한다. 쉽게 많이 만들 수 있지만 종료되지 않고 쌓이면 메모리 누수가 생기고, 연결을 쥔 채 남으면 FD도 샌다.
    - id: g.preemption
      name: 선점
      aliases:
        - Preemption
        - 선점형 스케줄링
      concept: os.scheduling
      gloss: 선점은 스케줄러가 실행 중인 스레드의 CPU를 강제로 빼앗아 다른 스레드에 넘기는 동작이다. 선점이 있어 한 작업이 CPU를 독차지하지 못하지만, 비자발적 컨텍스트 스위치가 늘어나는 원인도 된다.
    - id: g.spinlock
      name: 스핀락
      aliases:
        - Spinlock
      concept: os.mutex-and-lock
      gloss: 스핀락은 락이 풀릴 때까지 잠들지 않고 반복 확인하며 기다리는 락이다. 대기가 매우 짧을 때는 잠들고 깨어나는 비용을 아끼지만, 대기가 길어지면 CPU를 헛되이 소모한다.
    - id: g.condition-variable
      name: 조건 변수
      aliases:
        - Condition Variable
        - CondVar
      concept: os.mutex-and-lock
      gloss: 조건 변수는 특정 조건이 만족될 때까지 스레드를 재우고, 다른 스레드가 신호를 보내면 깨우는 동기화 도구다. 뮤텍스와 함께 쓰이며 작업 큐에 일이 들어올 때까지 워커를 대기시키는 구현에 쓰인다.
    - id: g.thread-dump
      name: 스레드 덤프
      aliases:
        - Thread Dump
        - 스택 덤프
        - goroutine dump
      concept: os.deadlock
      gloss: 스레드 덤프는 특정 시점에 모든 스레드가 어떤 함수에서 무엇을 기다리고 있는지 출력한 스냅샷이다. 서버가 에러 없이 멈췄을 때 떠서 교착 상태나 락 대기 지점을 찾는 데 쓴다.
    - id: g.aba-problem
      name: ABA 문제
      aliases:
        - ABA Problem
      concept: os.atomic-and-cas
      gloss: ABA 문제는 값이 A에서 B로 바뀌었다가 다시 A로 돌아왔을 때 CAS가 변경이 없었다고 오판하는 문제다. 값만 비교하는 락 프리 자료구조에서 생기며, 버전 번호를 함께 비교하는 방식으로 피한다.
    - id: g.page-fault
      name: 페이지 폴트
      aliases:
        - Page Fault
        - Major Fault
        - Minor Fault
      concept: os.mmap-page-fault
      gloss: 페이지 폴트는 프로세스가 접근한 가상 주소에 유효한 페이지 테이블 매핑이 없거나 권한이 맞지 않아 커널이 개입하는 사건이다. 디스크나 스왑에서 읽어 와야 하는 메이저 폴트는 비용이 커서 지연의 원인이 된다.
    - id: g.mmu-tlb
      name: MMU와 TLB
      aliases: []
      concept: arch.tlb-huge-pages
      gloss: MMU는 가상 주소를 물리 주소로 바꾸는 CPU 안의 하드웨어이고, TLB는 최근 변환 결과를 저장하는 캐시다. TLB에 없으면 페이지 테이블을 다시 찾아야 해서 메모리 접근이 느려진다.
    - id: g.mmap
      name: mmap
      aliases:
        - 메모리 매핑
        - Memory-mapped File
      concept: os.mmap-page-fault
      gloss: mmap은 파일이나 메모리 영역을 프로세스 주소 공간에 연결하는 시스템 콜이다. 파일을 메모리처럼 읽고 쓸 수 있어 일부 데이터베이스와 런타임이 사용하며, 가상 메모리 크기가 크게 보이는 원인 중 하나다.
    - id: g.memory-leak
      name: 메모리 누수
      aliases:
        - Memory Leak
        - 메모리 릭
      concept: os.memory-metrics
      gloss: 메모리 누수는 더 이상 쓰지 않는 메모리가 해제되지 않고 계속 쌓이는 현상이다. GC 언어에서도 전역 캐시나 끝나지 않는 작업이 참조를 쥐고 있으면 생기며, 결국 OOM 종료로 이어진다.
    - id: g.dmesg
      name: dmesg
      aliases:
        - 커널 로그
        - Kernel Log
        - journalctl -k
      concept: os.memory-oom
      gloss: dmesg는 커널이 남긴 메시지를 출력하는 명령으로, OOM Killer 동작이나 하드웨어 오류 기록이 여기에 남는다. 앱 로그 없이 프로세스가 사라졌을 때 확인할 첫 번째 증거다.
    - id: g.pipe
      name: 파이프
      aliases:
        - Pipe
        - 익명 파이프
      concept: os.file-descriptor
      gloss: 파이프는 한 프로세스의 출력을 다른 프로세스의 입력으로 바로 넘기는 커널의 단방향 통로다. 셸에서 명령을 세로 막대로 잇는 것이 파이프이며, 양 끝은 각 프로세스에서 파일 디스크립터로 보인다.
    - id: g.lsof
      name: lsof
      aliases:
        - list open files
      concept: os.file-descriptor
      gloss: lsof는 프로세스가 열어 둔 파일, 소켓, 파이프 목록을 보여 주는 도구다. 어떤 프로세스가 특정 포트를 점유하는지, FD가 어디서 새고 있는지, 지운 파일을 누가 붙잡고 있는지 확인할 때 쓴다.
    - id: g.listen-backlog
      name: Listen Backlog
      aliases:
        - 백로그
        - Accept Queue
        - somaxconn
      concept: net.tcp-accept-backlog
      gloss: Listen Backlog는 연결이 수립됐지만 서버가 아직 accept하지 않은 연결이 대기하는 큐다. 서버가 accept를 늦게 하면 큐가 차서 새 연결이 거부되거나 지연되므로 순간 트래픽 급증 때 문제가 된다.
    - id: g.unix-domain-socket
      name: 유닉스 도메인 소켓
      aliases:
        - Unix Domain Socket
        - UDS
        - .sock 파일
      concept: os.socket
      gloss: 유닉스 도메인 소켓은 같은 머신 안의 프로세스끼리 파일 경로를 주소로 삼아 통신하는 소켓이다. 네트워크 스택을 거치지 않아 가볍고, Docker 데몬이나 DB 로컬 접속에 흔히 쓰인다.
    - id: g.libuv
      name: libuv
      aliases:
        - Node.js libuv
      concept: os.event-loop
      gloss: libuv는 Node.js의 이벤트 루프와 비동기 I/O를 구현하는 C 라이브러리다. 운영체제별 I/O 멀티플렉싱을 감싸고, 파일 I/O처럼 논블로킹으로 처리하기 어려운 작업은 내부 스레드 풀로 넘긴다.
    - id: g.stop-the-world
      name: Stop-the-World
      aliases:
        - STW
        - 전체 정지
      concept: os.gc-memory-management
      gloss: Stop-the-World는 GC가 안전하게 작업하려고 애플리케이션의 모든 실행을 잠시 멈추는 구간이다. 이 구간 동안 요청 처리도 멈추므로 길어지면 p99 지연이 튀는 형태로 드러난다.
    - id: g.escape-analysis
      name: 이스케이프 분석
      aliases:
        - Escape Analysis
      concept: os.gc-memory-management
      gloss: 이스케이프 분석은 컴파일러가 변수가 함수 밖에서도 쓰이는지 판단해 스택에 둘지 힙에 둘지 정하는 과정이다. 힙으로 빠져나가는 값이 줄면 GC가 회수할 대상도 줄어 GC 부담이 낮아진다.
