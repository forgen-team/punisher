area: computer-architecture
concepts:
    arch.cache-coherence-false-sharing: 캐시 일관성은 여러 코어의 캐시가 같은 메모리 위치를 서로 모순 없이 보게 하는 하드웨어 규약이다. 서로 다른 변수라도 같은 캐시 라인에 있으면 코어 간 무효화가 반복되는데 이것이 false sharing이며, 스레드별 카운터가 오히려 느려지는 원인이다.
    arch.cache-locality: 지역성은 최근에 쓴 데이터나 가까운 주소의 데이터를 곧 다시 쓰는 경향을 말한다. 접근 패턴이 지역성을 따르면 캐시가 잘 맞기 때문에, 같은 알고리즘이라도 배열 순회가 연결 리스트 순회보다 빠르고 자료 배치만 바꿔도 집계가 빨라진다.
    arch.cpu-cache: CPU 캐시는 CPU와 RAM 사이에 있는 작고 빠른 메모리로, 데이터를 캐시 라인 단위로 가져온다. 캐시 미스가 잦으면 CPU 사용률이 높게 찍혀도 실제로는 메모리를 기다리는 시간이 많다.
    arch.cpu-instruction-execution: CPU는 메모리에서 명령을 가져와(fetch) 해석하고(decode) 실행하는(execute) 사이클을 반복한다. 레지스터와 클럭, 명령 처리 방식을 알면 코어 수가 같아도 인스턴스 타입에 따라 처리량이 다른 이유를 해석할 수 있다.
    arch.data-representation: 데이터 표현은 정수·문자·실수 같은 값을 고정된 폭의 비트열로 나타내는 규칙이다. 타입의 비트 폭과 인코딩을 알아야 ID 컬럼 오버플로나 바이트 기준 길이 제한 때문에 한글이 잘리는 문제를 설명할 수 있다.
    arch.dma: DMA는 장치가 CPU를 거치지 않고 메모리와 직접 데이터를 주고받게 하는 기능이다. CPU 복사를 줄이는 zero-copy 전송의 기반이라서, 정적 파일 서빙에서 sendfile을 켜면 CPU 사용량이 줄어드는 이유를 설명해 준다.
    arch.endianness-alignment: 엔디언은 여러 바이트로 된 값을 메모리나 네트워크에 놓는 바이트 순서이고, 정렬은 값이 놓이는 주소의 경계 규칙이다. 바이너리 프로토콜을 파싱할 때 바이트 순서가 어긋나면 값이 깨지고, 구조체에 패딩이 들어가면 메모리 크기가 커진다.
    arch.floating-point: 부동소수점은 실수를 가수와 지수로 나눠 근사값으로 저장하는 방식이며, IEEE 754가 표준이다. 0.1 + 0.2가 정확히 0.3이 되지 않기 때문에 금액 계산에는 정수나 decimal 타입을 써야 한다.
    arch.io-devices-interrupts: 인터럽트는 디스크나 네트워크 카드 같은 장치가 작업이 끝났다고 CPU에 알리는 신호다. I/O를 기다리는 프로세스는 CPU를 쓰지 않기 때문에, CPU 사용률은 낮은데 응답이 느린 서버를 진단할 때 이 구조를 알아야 한다.
    arch.latency-numbers: 지연 시간 감각은 캐시·메모리·디스크·네트워크 접근이 대략 몇 자릿수씩 차이 나는지 몸에 익혀 둔 감을 말한다. 반복문 안의 원격 호출처럼 느린 설계를 코드 리뷰 단계에서 미리 알아보는 기준이 된다.
    arch.memory-hierarchy: 메모리 계층은 레지스터·캐시·RAM·디스크로 이어지는 저장 구조이며, 아래로 갈수록 용량은 크고 값은 싸지만 느려진다. 데이터가 메모리에 다 들어가지 않게 되는 순간 디스크 I/O가 병목이 되는 현상을 이 구조로 설명한다.
    arch.memory-ordering: 메모리 순서와 가시성은 한 스레드가 쓴 값이 다른 스레드에 언제, 어떤 순서로 보이는지에 관한 규칙이다. CPU와 컴파일러가 연산 순서를 바꿀 수 있어서, 동기화 없이 플래그로 신호를 보내면 루프가 끝나지 않는 버그가 생길 수 있다.
    arch.multicore: 멀티코어는 한 CPU 안의 여러 코어가 서로 다른 작업을 실제로 동시에 실행하는 구조다. 공유 데이터와 직렬 구간 때문에 코어를 늘린 만큼 성능이 오르지는 않으므로, vCPU 증설 효과를 예측할 때 필요하다.
    arch.numa: NUMA는 여러 CPU 소켓을 가진 서버에서 CPU마다 가까운 메모리와 먼 메모리가 있어 접근 비용이 달라지는 구조다. 코어가 많은 대형 서버로 옮긴 뒤 DB나 JVM의 지연이 들쭉날쭉해질 때 원인 후보가 된다.
    arch.pipeline-branch-prediction: 파이프라인은 여러 명령의 단계를 겹쳐 실행해 처리량을 높이는 방식이고, 분기 예측은 조건문의 결과를 미리 추측해 실행을 이어가는 기법이다. 예측이 자주 틀리면 미리 실행한 작업을 버리는 비용이 쌓여, 정렬 여부만으로 같은 루프의 속도가 달라진다.
    arch.storage-devices: SSD와 HDD는 데이터를 영구 저장하는 장치로, HDD는 헤드가 움직여야 해서 랜덤 접근이 특히 느리고 SSD는 전자적으로 접근한다. DB 성능을 볼 때는 IOPS·처리량·지연을 구분해야 하고, 클라우드 볼륨의 IOPS 한도도 함께 봐야 한다.
terms:
    - id: g.twos-complement
      name: 2의 보수
      aliases:
        - Two's Complement
        - 2의 보수 표현
      concept: arch.data-representation
      gloss: 2의 보수는 음수를 표현할 때 비트를 모두 뒤집고 1을 더하는 방식으로, 대부분의 CPU가 부호 있는 정수를 이렇게 저장한다. 최댓값에 1을 더하면 음수로 넘어가는 오버플로가 바로 이 표현에서 나온다.
    - id: g.utf-8
      name: UTF-8
      aliases:
        - UTF8
        - 유니코드 인코딩
      concept: arch.data-representation
      gloss: UTF-8은 유니코드 문자를 1~4바이트로 저장하는 가변 길이 인코딩이다. 영문은 1바이트이고 한글은 대개 3바이트라서, 길이 제한을 바이트로 셀지 문자로 셀지에 따라 결과가 달라진다.
    - id: g.isa
      name: 명령어 집합 구조(ISA)
      aliases:
        - ISA
        - Instruction Set Architecture
        - x86
        - ARM
      concept: arch.cpu-instruction-execution
      gloss: ISA는 CPU가 이해하는 기계어 명령의 종류와 형식을 정한 규약으로, x86과 ARM이 대표적이다. 컨테이너 이미지나 바이너리는 ISA별로 따로 빌드해야 해서, ARM 인스턴스로 옮길 때 이미지 호환 문제가 생긴다.
    - id: g.vcpu
      name: vCPU
      aliases:
        - 가상 CPU
        - Virtual CPU
      concept: arch.multicore
      gloss: vCPU는 클라우드나 가상 머신이 게스트에게 보여 주는 논리 CPU 단위다. 하이퍼스레드 하나에 대응하는 경우가 많아 물리 코어와 성능이 같지 않으므로, 인스턴스 크기를 정할 때 이 차이를 감안해야 한다.
    - id: g.ipc
      name: IPC(사이클당 명령 수)
      aliases:
        - Instructions Per Cycle
        - 사이클당 명령어 수
      concept: arch.cpu-instruction-execution
      gloss: IPC는 CPU가 한 클럭 사이클에 평균 몇 개의 명령을 완료하는지 나타내는 지표다. IPC가 낮으면 CPU가 바쁘게 보여도 캐시 미스나 분기 예측 실패 등으로 대기하는 시간이 많을 수 있다.
    - id: g.simd
      name: SIMD
      aliases:
        - Single Instruction Multiple Data
        - 벡터 연산
        - AVX
        - NEON
      concept: arch.cpu-instruction-execution
      gloss: SIMD는 명령 하나로 여러 데이터에 같은 연산을 동시에 적용하는 CPU 기능이다. 데이터가 메모리에 연속으로 놓여 있어야 효과가 커서, 압축·해시·JSON 파싱 라이브러리의 성능 차이를 설명할 때 자주 등장한다.
    - id: g.cache-hit
      name: 캐시 히트
      aliases:
        - Cache Hit
        - 캐시 적중
        - 히트율
        - Hit Ratio
      concept: arch.cpu-cache
      gloss: 캐시 히트는 찾는 데이터가 이미 캐시에 있어서 느린 하위 계층까지 내려가지 않는 경우다. 히트율이 조금만 떨어져도 평균 접근 시간이 크게 늘어나므로 성능 분석에서 핵심 지표로 쓴다.
    - id: g.memory-stall
      name: 메모리 스톨
      aliases:
        - Memory Stall
        - Stall
        - 스톨
      concept: arch.cpu-cache
      gloss: 메모리 스톨은 필요한 데이터가 메모리에서 도착할 때까지 CPU가 명령을 진행하지 못하고 멈춰 있는 상태다. 운영체제는 이 시간도 CPU 사용 중으로 집계하기 때문에, 사용률 100%가 곧 계산량이 많다는 뜻은 아니다.
    - id: g.prefetch
      name: 프리페치
      aliases:
        - Prefetch
        - Prefetching
        - 하드웨어 프리페처
      concept: arch.cache-locality
      gloss: 프리페치는 곧 쓰일 것으로 보이는 데이터를 미리 캐시로 가져오는 동작이다. 순차 접근처럼 패턴이 일정하면 잘 맞고, 포인터를 따라가는 무작위 접근에서는 거의 효과가 없다.
    - id: g.tlb
      name: TLB
      aliases:
        - Translation Lookaside Buffer
        - 주소 변환 캐시
      concept: arch.memory-hierarchy
      gloss: TLB는 가상 주소를 물리 주소로 바꾼 결과를 저장해 두는 CPU 내부 캐시다. 넓은 메모리를 흩어서 접근하면 TLB 미스가 늘어 느려지며, 대형 DB에서 huge page 설정을 검토하는 이유가 된다.
    - id: g.mmu
      name: MMU
      aliases:
        - Memory Management Unit
        - 메모리 관리 장치
      concept: arch.memory-hierarchy
      gloss: MMU는 프로그램이 쓰는 가상 주소를 실제 물리 메모리 주소로 변환하는 하드웨어다. 프로세스마다 메모리가 격리되고 잘못된 주소 접근이 segmentation fault로 잡히는 것이 이 장치 덕분이다.
    - id: g.soa
      name: SoA와 AoS
      aliases:
        - Structure of Arrays
        - Array of Structures
        - 필드별 배열
      concept: arch.cache-locality
      gloss: AoS는 객체를 통째로 배열에 담는 배치이고, SoA는 필드마다 별도 배열을 두는 배치다. 특정 필드만 집계할 때 SoA는 필요한 값만 연속으로 읽게 되어 캐시 효율이 크게 오른다.
    - id: g.amdahls-law
      name: 암달의 법칙
      aliases:
        - Amdahl's Law
        - 암달 법칙
      concept: arch.multicore
      gloss: 암달의 법칙은 작업 중 병렬화할 수 없는 부분의 비율이 전체 속도 향상의 한계를 정한다는 법칙이다. 코어나 인스턴스를 늘려도 처리량이 비례해 오르지 않는 이유를 설명할 때 쓴다.
    - id: g.data-race
      name: 데이터 레이스
      aliases:
        - Data Race
        - 데이터 경합
      concept: arch.memory-ordering
      gloss: 데이터 레이스는 두 스레드가 동기화 없이 같은 메모리에 접근하고 그중 하나 이상이 쓰기인 상황이다. 언어 메모리 모델에서는 결과를 보장하지 않으므로, Go의 -race 같은 도구로 검출해 제거해야 한다.
    - id: g.reordering
      name: 명령 재정렬
      aliases:
        - Reordering
        - Instruction Reordering
        - 메모리 재정렬
      concept: arch.memory-ordering
      gloss: 명령 재정렬은 컴파일러나 CPU가 결과가 같다고 판단하면 메모리 읽기·쓰기 순서를 바꾸는 최적화다. 단일 스레드에서는 티가 나지 않지만, 다른 스레드에서는 코드에 적힌 순서와 다르게 보일 수 있다.
    - id: g.happens-before
      name: happens-before
      aliases:
        - 선행 관계
      concept: arch.memory-ordering
      gloss: happens-before는 한 연산의 결과가 다른 연산에 반드시 보이도록 보장하는 순서 관계다. 락 해제와 획득, 채널 송수신 같은 동기화가 이 관계를 만들며, 동시성 코드의 정확성을 따질 때 기준이 된다.
    - id: g.spectre
      name: Spectre·Meltdown
      aliases:
        - Spectre
        - Meltdown
        - 투기적 실행 취약점
      concept: arch.pipeline-branch-prediction
      gloss: Spectre와 Meltdown은 투기적 실행이 캐시에 남긴 흔적을 이용해 접근 권한이 없는 메모리를 읽어 내는 CPU 취약점 계열이다. 운영체제와 펌웨어 패치로 완화하지만, 시스템 콜이 많은 워크로드에서는 성능이 떨어질 수 있다.
    - id: g.iowait
      name: iowait
      aliases:
        - wa
        - I/O 대기
      concept: arch.io-devices-interrupts
      gloss: iowait는 CPU가 할 일이 없는데 처리 중인 디스크 I/O가 있는 시간의 비율이다. 높으면 디스크 병목을 의심할 수 있지만, CPU가 바쁘면 오히려 낮게 나오므로 이 값만으로 판단하면 안 된다.
    - id: g.sendfile
      name: sendfile
      aliases:
        - sendfile(2)
      concept: arch.dma
      gloss: sendfile은 파일 내용을 유저 공간으로 복사하지 않고 커널 안에서 바로 소켓으로 보내는 시스템 콜이다. nginx 같은 웹 서버가 정적 파일을 서빙할 때 복사 횟수와 CPU 사용을 줄이는 데 쓴다.
    - id: g.seek-time
      name: 탐색 시간
      aliases:
        - Seek Time
        - 시크 타임
      concept: arch.storage-devices
      gloss: 탐색 시간은 HDD의 헤드가 데이터가 있는 트랙까지 물리적으로 이동하는 데 걸리는 시간이다. 랜덤 접근이 많을수록 이 시간이 누적되어, HDD에서 랜덤 I/O가 순차 I/O보다 훨씬 느린 이유가 된다.
    - id: g.sequential-random-io
      name: 순차 I/O와 랜덤 I/O
      aliases:
        - Sequential IO
        - Random IO
        - 순차 접근
        - 랜덤 접근
      concept: arch.storage-devices
      gloss: 순차 I/O는 연속된 위치를 차례로 읽고 쓰는 접근이고, 랜덤 I/O는 흩어진 위치에 접근하는 방식이다. 로그 추가 쓰기나 WAL처럼 순차 쓰기를 활용하는 설계가 많은 것은 장치가 순차 접근에 유리하기 때문이다.
    - id: g.throughput
      name: 처리량
      aliases:
        - Throughput
        - MB/s
      concept: arch.storage-devices
      gloss: 처리량은 단위 시간에 옮길 수 있는 데이터 양이다. IOPS나 지연과는 다른 지표라서, 큰 파일 백업은 처리량에 묶이고 작은 랜덤 쿼리는 IOPS와 지연에 묶인다.
    - id: g.write-amplification
      name: 쓰기 증폭
      aliases:
        - Write Amplification
        - WAF
      concept: arch.storage-devices
      gloss: 쓰기 증폭은 애플리케이션이 쓴 양보다 저장 장치에 실제로 기록되는 양이 더 많아지는 현상이다. SSD는 페이지 단위로 쓰고 블록 단위로 지워서 가비지 컬렉션 때 유효 데이터를 옮기며 생기고, 쓰기 성능 저하와 수명 단축으로 이어진다.
    - id: g.nvme
      name: NVMe
      aliases:
        - NVM Express
        - NVMe SSD
      concept: arch.storage-devices
      gloss: NVMe는 SSD를 PCIe 버스에 직접 연결하도록 설계된 저장 장치 인터페이스 규격이다. 기존 SATA 방식보다 명령 큐가 깊어 병렬 I/O에 유리하며, 클라우드의 로컬 인스턴스 스토리지에서 자주 보인다.
    - id: g.burst-credit
      name: 버스트 크레딧
      aliases:
        - Burst Credit
        - IOPS 크레딧
        - CPU 크레딧
        - 버스트 성능
      concept: arch.storage-devices
      gloss: 버스트 크레딧은 일부 클라우드 디스크나 인스턴스가 평소 쌓아 둔 크레딧을 써서 기본 성능 이상을 잠시 내게 하는 방식이다. 크레딧이 바닥나면 성능이 기본선으로 떨어지므로, 평소에 잘 돌던 DB가 갑자기 느려지는 장애의 원인이 된다.
    - id: g.rtt
      name: RTT
      aliases:
        - Round Trip Time
        - 왕복 시간
        - 네트워크 왕복
      concept: arch.latency-numbers
      gloss: RTT는 요청이 상대에게 갔다가 응답이 돌아오기까지 걸리는 왕복 시간이다. 요청 하나가 거치는 왕복 횟수에 RTT를 곱하면 최소 지연을 추정할 수 있어서, 원격 호출을 묶을지 판단하는 근거가 된다.
    - id: g.decimal
      name: Decimal
      aliases:
        - numeric
        - BigDecimal
      concept: arch.floating-point
      gloss: Decimal은 숫자를 10진수 자릿수 그대로 저장해 0.1 같은 값을 오차 없이 표현하는 타입이다. 부동소수점보다 느리지만 금액·세금 계산처럼 정확성이 중요한 곳에서 쓰고, DB에서는 numeric 컬럼이 이에 해당한다.
    - id: g.cpu-affinity
      name: CPU 어피니티
      aliases:
        - CPU Affinity
        - CPU 피닝
        - CPU Pinning
      concept: arch.numa
      gloss: CPU 어피니티는 프로세스나 스레드를 특정 코어에서만 실행하도록 묶는 설정이다. NUMA 서버에서 같은 노드의 CPU와 메모리를 쓰게 묶으면 원격 메모리 접근을 줄여 지연 편차를 낮출 수 있다.
    - id: g.network-byte-order
      name: 네트워크 바이트 순서
      aliases:
        - Network Byte Order
        - htonl
        - ntohl
      concept: arch.endianness-alignment
      gloss: 네트워크 바이트 순서는 인터넷 프로토콜 헤더에서 여러 바이트 값을 빅 엔디언으로 보내기로 한 약속이다. 리틀 엔디언 CPU에서는 보내기 전과 받은 뒤에 변환해야 하며, 이를 빠뜨리면 포트 번호나 길이 값이 엉뚱하게 읽힌다.
    - id: g.padding
      name: 패딩
      aliases:
        - Padding
        - 구조체 패딩
        - Struct Padding
      concept: arch.endianness-alignment
      gloss: 패딩은 필드를 정렬 경계에 맞추려고 컴파일러가 구조체 필드 사이나 끝에 넣는 빈 바이트다. 필드 순서만 바꿔도 구조체 크기가 줄 수 있고, 캐시 라인을 분리해 false sharing을 막는 용도로도 쓴다.
