area: database
concepts:
    db.backup-and-restore: DB 백업과 복원은 데이터 사본을 따로 보관했다가 사고가 나면 되살리는 절차로, 논리 백업·물리 백업·시점 복구가 있다. 방식마다 되돌릴 수 있는 시점과 걸리는 시간이 다르다. 실제로 복원해 봐야 백업이 쓸모 있는지 알 수 있다.
    db.btree-vs-lsm: B-Tree 엔진은 데이터를 제자리에서 고쳐 읽기가 고르게 빠르고, LSM 엔진은 쓰기를 모아 파일로 한꺼번에 내린 뒤 나중에 합쳐 쓰기에 강하다. 워크로드의 읽기·쓰기 비율에 따라 맞는 엔진이 다르다.
    db.composite-index: 복합 인덱스는 여러 컬럼을 정해진 순서로 묶어 정렬한 인덱스다. 앞쪽 컬럼에 조건이 있어야 효과적으로 쓰인다. 쿼리에 필요한 컬럼을 모두 담으면 테이블을 읽지 않고 인덱스만으로 응답할 수 있다.
    db.connection-pool: DB 커넥션 풀은 미리 만든 DB 연결을 여러 요청이 돌려 쓰게 하는 장치다. 연결 생성은 비싸고 DB의 최대 연결 수는 제한되어 있다. 인스턴스 수 × 풀 크기가 한도를 넘거나 풀이 고갈되면 요청이 대기하다 타임아웃된다.
    db.deadlock: DB 교착 상태는 두 트랜잭션이 서로 상대가 쥔 잠금을 기다려 둘 다 진행하지 못하는 상황이다. DB는 이를 감지하면 한쪽을 오류로 중단시킨다. 그래서 갱신 순서를 통일하고 실패한 트랜잭션을 재시도하도록 코드를 짜야 한다.
    db.gap-next-key-lock: MySQL InnoDB는 팬텀을 막으려고 행뿐 아니라 행 사이 빈 구간까지 잠근다. 이를 갭 락, 행과 앞 구간을 함께 잠그는 것을 넥스트 키 락이라 하며, 인덱스가 없으면 넓게 잠겨 INSERT가 막히거나 교착 상태가 생긴다.
    db.index: 인덱스는 특정 컬럼 값을 정렬해 둔 보조 구조로, 테이블 전체를 읽지 않고 필요한 행만 찾게 한다. 대신 쓰기마다 갱신 비용과 저장 공간이 든다. 조건 컬럼에 함수를 씌우거나 조건에 걸리는 행의 비율이 높으면 인덱스가 쓰이지 않을 수 있다.
    db.isolation-levels: 격리 수준은 동시에 실행되는 트랜잭션이 서로의 변경을 어디까지 볼 수 있는지 정하는 설정이다. 기본 수준에서도 갱신 손실이 생길 수 있다. 두 요청이 같은 값을 읽고 각각 갱신하면 한쪽 변경이 사라진다.
    db.joins: 조인은 키 관계를 따라 여러 테이블의 행을 하나의 결과로 합치는 연산이다. INNER와 LEFT의 차이로 행이 사라질 수 있다. 일대다 조인으로 행이 늘어나 합계가 부풀려지는 일이 리포트 쿼리에서 자주 생긴다.
    db.locking: DB 잠금은 한 트랜잭션이 행이나 테이블을 잡아 두고, 같은 대상을 수정하려는 다른 트랜잭션을 기다리게 하는 장치다. 긴 트랜잭션이나 운영 중 DDL이 잠금을 오래 쥐면 뒤따르는 요청이 줄줄이 막힌다.
    db.mvcc: MVCC는 행을 수정할 때 새 버전을 만들고, 각 트랜잭션이 자기 시점의 버전을 읽게 해 읽기와 쓰기가 서로 막지 않게 하는 방식이다. PostgreSQL에서는 오래된 버전을 VACUUM이 정리한다. 오래 열린 트랜잭션이 있으면 정리가 막혀 테이블이 커진다.
    db.n-plus-one: N+1 쿼리 문제는 목록을 한 번 조회한 뒤 각 항목의 연관 데이터를 가져오려고 쿼리를 N번 더 보내는 현상이다. ORM 지연 로딩에서 흔하다. 개발 데이터에서는 드러나지 않다가 운영에서 응답 지연과 DB 부하로 나타난다.
    db.normalization: 정규화는 같은 사실을 한 곳에만 저장하도록 테이블을 나눠 갱신 이상을 막는 설계다. 반정규화는 읽기 성능을 위해 중복을 일부러 허용하는 것이다. 중복을 두면 원본이 바뀔 때 복사본을 누가 어떻게 맞출지 정해야 한다.
    db.nosql-models: NoSQL 데이터 모델은 키-값·문서·와이드 컬럼처럼 테이블과 조인 대신 조회 패턴에 맞춰 데이터를 저장하는 방식들이다. 수평 확장이 쉬운 대신 조인과 여러 레코드에 걸친 트랜잭션 일부를 포기한다. 그래서 조회 패턴을 먼저 정하고 골라야 한다.
    db.optimistic-locking: 낙관적 잠금은 미리 잠그지 않고, 갱신할 때 읽었던 버전 값이 그대로인지 조건으로 확인해 충돌을 감지하는 방식이다. 관리자 화면 동시 편집처럼 충돌이 드문 곳에서 덮어쓰기를 막는다. 충돌하면 재시도하거나 사용자에게 확인받는다.
    db.pagination: 페이지네이션은 큰 결과를 일정 크기씩 나눠 가져오는 방식으로, OFFSET 방식과 마지막 키 이후만 읽는 키셋(커서) 방식이 있다. OFFSET은 뒤 페이지일수록 느리고 데이터가 추가되면 중복·누락이 생긴다. 그래서 무한 스크롤에는 커서 방식이 맞다.
    db.query-optimizer-statistics: 쿼리 옵티마이저는 테이블 통계로 각 단계에서 나올 행 수를 추정해 가장 싸 보이는 실행 계획을 고른다. 통계가 오래되거나 데이터가 한쪽에 몰리면 추정이 빗나가 갑자기 느린 계획이 선택된다.
    db.query-plan: 실행 계획은 옵티마이저가 통계를 바탕으로 고른 쿼리 처리 방법(스캔 방식·조인 순서 등)이며 EXPLAIN으로 확인한다. 느린 쿼리를 고칠 때는 추측하지 않고 실제 시간과 추정·실제 행 수의 차이를 보고 원인을 찾는다.
    db.relational-model: 관계형 모델은 데이터를 행과 열로 된 테이블에 담는 방식이다. 기본 키로 행을 식별하고 외래 키로 테이블 사이의 관계를 맺는다. 유니크·외래 키 같은 제약을 DB에 두면 코드 버그나 동시 요청이 있어도 제약을 어기는 데이터는 저장되지 않는다.
    db.replication: 복제는 주 DB의 변경을 복제본 DB에 전달해 같은 데이터를 유지하는 것이다. 읽기 분산과 장애 대비에 쓰인다. 비동기 복제에서는 방금 쓴 값이 복제본에 아직 없어, 정보를 수정한 직후 화면에 옛 값이 보일 수 있다.
    db.replication-lag-consistency: 읽기 복제본은 주 DB보다 조금 늦게 따라오므로, 방금 쓴 데이터를 복제본에서 읽으면 안 보이거나 값이 오락가락할 수 있다. 쓰기 직후 읽기는 주 DB로 보내는 식의 규칙으로 일관성을 맞춘다.
    db.schema-migration: 스키마 마이그레이션은 테이블·컬럼·인덱스 변경을 버전 붙은 스크립트로 관리하고 순서대로 적용하는 방식이다. 운영 중에는 잠금과 구버전 코드 호환을 고려해야 한다. 확장→이전→축소 단계로 나누면 무중단 배포와 롤백이 가능하다.
    db.sql-basics: SQL은 원하는 데이터를 선언하면 DB가 실행 방법을 정하는 질의 언어다. 필터·집계·정렬을 SQL에서 처리하면 애플리케이션으로 넘어오는 데이터가 줄어든다. NULL 처리 규칙을 모르면 조건이 오류 없이 틀어진다.
    db.transaction: 트랜잭션은 여러 읽기·쓰기를 하나의 단위로 묶어 전부 반영(커밋)하거나 전부 취소(롤백)하는 장치다. 주문 생성과 재고 차감처럼 함께 성공해야 하는 변경을 묶지 않으면 장애가 났을 때 데이터가 어긋난다.
    db.vacuum-bloat: PostgreSQL은 수정·삭제된 옛 행을 바로 지우지 않고 VACUUM이 나중에 정리한다. 정리가 밀리거나 오래 열린 트랜잭션이 막으면 테이블과 인덱스가 부풀어(블로트) 디스크를 차지하고 조회가 느려진다.
    db.wal-and-durability: WAL은 데이터 파일을 바꾸기 전에 변경 내용을 로그로 먼저 디스크에 기록하는 방식이다. 이 덕분에 커밋된 데이터가 장애 후에도 복구되며, 이를 내구성이라 한다. 복제와 시점 복구도 WAL 위에서 동작하므로 WAL이 쌓여 디스크가 차는 장애도 생긴다.
terms:
    - id: g.seq-scan
      name: 순차 스캔
      aliases:
        - Seq Scan
        - Sequential Scan
        - 풀 테이블 스캔
        - Full Table Scan
      concept: db.query-plan
      gloss: 순차 스캔은 테이블의 모든 행을 처음부터 끝까지 읽으며 조건을 검사하는 방식이다. 작은 테이블에서는 정상이다. 큰 테이블에서 보이면 인덱스가 없거나 쓰이지 못하는 상황일 가능성이 높다.
    - id: g.selectivity
      name: 선택도
      aliases:
        - Selectivity
      concept: db.index
      gloss: 선택도는 조건을 만족하는 행이 전체에서 차지하는 비율이다. 대부분의 행이 걸리는 조건에서는 인덱스보다 순차 스캔이 나을 수 있다. 그래서 옵티마이저가 인덱스가 있어도 쓰지 않기도 한다.
    - id: g.cardinality
      name: 카디널리티
      aliases:
        - Cardinality
      concept: db.index
      gloss: 카디널리티는 컬럼에 들어 있는 서로 다른 값의 개수, 또는 실행 계획 각 단계의 예상 결과 행 수를 뜻한다. 고유값이 많은 컬럼일수록 인덱스 효과가 크다. 예상 행 수가 틀리면 옵티마이저가 잘못된 계획을 고른다.
    - id: g.planner-statistics
      name: 테이블 통계
      aliases:
        - Planner Statistics
        - 통계 정보
      concept: db.query-optimizer-statistics
      gloss: 테이블 통계는 옵티마이저가 행 수와 값 분포를 추정하는 데 쓰는 요약 정보이며 ANALYZE로 갱신한다. 대량 적재 직후처럼 통계가 낡으면 추정이 크게 빗나가 갑자기 느린 계획이 선택될 수 있다.
    - id: g.nested-loop-join
      name: 중첩 루프 조인
      aliases:
        - Nested Loop Join
        - Nested Loop
      concept: db.joins
      gloss: 중첩 루프 조인은 바깥 테이블의 각 행마다 안쪽 테이블에서 일치하는 행을 찾는 조인 방식이다. 바깥 행이 적고 안쪽에 인덱스가 있으면 빠르다. 바깥 행이 예상보다 많으면 급격히 느려진다.
    - id: g.hash-join
      name: 해시 조인
      aliases:
        - Hash Join
      concept: db.joins
      gloss: 해시 조인은 한쪽 테이블로 조인 키의 해시 테이블을 메모리에 만든 뒤 다른 쪽을 훑으며 짝을 찾는 방식이다. 큰 테이블끼리 등호 조건으로 조인할 때 주로 선택된다. 메모리가 부족하면 디스크를 써서 느려진다.
    - id: g.cartesian-product
      name: 카티션 곱
      aliases:
        - Cartesian Product
        - Cross Join
        - 데카르트 곱
      concept: db.joins
      gloss: 카티션 곱은 두 테이블의 모든 행 조합을 만든 결과로, 조인 조건이 없거나 잘못되면 생긴다. 행 수가 곱으로 늘어나 쿼리가 끝나지 않거나 결과가 비정상적으로 커진다.
    - id: g.unique-constraint
      name: 유니크 제약
      aliases:
        - Unique Constraint
        - UNIQUE
        - 고유 제약
      concept: db.relational-model
      gloss: 유니크 제약은 지정한 컬럼 값이 테이블 안에서 중복되지 않도록 DB가 강제하는 규칙이다. 코드에서 먼저 조회해 검사해도 동시 요청은 막지 못한다. 그래서 이메일처럼 유일해야 하는 값에는 DB 제약을 둔다.
    - id: g.upsert
      name: 업서트
      aliases:
        - Upsert
        - INSERT ON CONFLICT
        - ON DUPLICATE KEY UPDATE
      concept: db.relational-model
      gloss: 업서트는 행이 없으면 삽입하고 키가 이미 있으면 갱신하는 단일 SQL 연산이다. 조회 후 삽입하는 코드는 동시 요청에서 중복 오류가 나기 쉽다. 유니크 제약과 업서트를 함께 쓰면 동시 요청에서도 중복 오류 없이 처리된다.
    - id: g.cte
      name: CTE
      aliases:
        - Common Table Expression
        - WITH 절
        - 공통 테이블 식
      concept: db.sql-basics
      gloss: CTE는 WITH 절로 이름 붙인 임시 결과를 만들어 같은 쿼리 안에서 참조하는 문법이다. 복잡한 집계 쿼리를 단계별로 나눠 읽기 쉽게 만들 때 쓴다. 재귀 CTE로는 트리 구조 데이터를 조회한다.
    - id: g.window-function
      name: 윈도 함수
      aliases:
        - Window Function
        - OVER 절
        - ROW_NUMBER
      concept: db.sql-basics
      gloss: 윈도 함수는 행을 그룹으로 합치지 않고 각 행에 그룹 안의 순위·누적합 같은 값을 계산해 붙이는 SQL 함수다. 사용자별 최신 1건 조회나 누적 매출 계산을 애플리케이션 루프 없이 한 쿼리로 처리한다.
    - id: g.expression-index
      name: 표현식 인덱스
      aliases:
        - Expression Index
        - 함수 기반 인덱스
        - Functional Index
      concept: db.index
      gloss: 표현식 인덱스는 컬럼 원본 대신 lower(email) 같은 식의 결과로 만든 인덱스다. 조건에 함수를 씌우면 일반 인덱스가 쓰이지 않는다. 같은 식으로 인덱스를 만들면 그 조건에서 인덱스를 쓸 수 있다.
    - id: g.orm
      name: ORM
      aliases:
        - Object-Relational Mapping
        - 객체 관계 매핑
      concept: db.n-plus-one
      gloss: ORM은 테이블 행을 코드의 객체로 매핑해 SQL을 직접 쓰지 않고 데이터를 다루게 하는 도구다. 편리하지만 어떤 쿼리가 몇 번 나가는지 가려진다. 그래서 N+1이나 불필요한 전체 컬럼 조회가 생기기 쉽다.
    - id: g.eager-loading
      name: 즉시 로딩
      aliases:
        - Eager Loading
        - Preload
        - Include
      concept: db.n-plus-one
      gloss: 즉시 로딩은 목록을 조회할 때 연관 데이터를 조인이나 IN 절로 미리 함께 가져오는 방식이다. N+1을 해결하는 대표적 방법이다. 필요 없는 연관까지 불러오면 오히려 데이터량이 커진다.
    - id: g.autocommit
      name: 오토커밋
      aliases:
        - Autocommit
        - 자동 커밋
      concept: db.transaction
      gloss: 오토커밋은 명시적 트랜잭션 없이 실행한 SQL 문을 하나씩 즉시 커밋하는 동작이다. 여러 문을 묶어야 할 때 트랜잭션을 열지 않으면 중간에 실패했을 때 일부만 반영된다.
    - id: g.dirty-read
      name: 더티 리드
      aliases:
        - Dirty Read
      concept: db.isolation-levels
      gloss: 더티 리드는 다른 트랜잭션이 아직 커밋하지 않은 변경을 읽는 현상이다. 그 트랜잭션이 롤백되면 존재한 적 없는 값을 근거로 처리한 셈이 된다. 대부분의 DB는 기본 격리 수준에서 이를 막는다.
    - id: g.phantom-read
      name: 팬텀 리드
      aliases:
        - Phantom Read
      concept: db.isolation-levels
      gloss: 팬텀 리드는 한 트랜잭션에서 같은 조건으로 두 번 조회했는데, 그 사이 다른 트랜잭션이 커밋한 삽입·삭제 때문에 결과 행 집합이 달라지는 현상이다. 기존 행의 값이 바뀌는 것은 반복 불가능한 읽기라 한다. 검사 후 처리하는 로직이 이 변경을 놓쳐 잘못 판단한다.
    - id: g.write-skew
      name: 쓰기 스큐
      aliases:
        - Write Skew
      concept: db.isolation-levels
      gloss: 쓰기 스큐는 두 트랜잭션이 같은 조건을 읽고 각자 다른 행을 수정해, 각각은 유효하지만 합치면 규칙이 깨지는 현상이다. 당직 최소 인원 검사나 중복 예약 방지처럼 여러 행에 걸친 규칙에서 생긴다.
    - id: g.serialization-failure
      name: 직렬화 실패
      aliases:
        - Serialization Failure
        - could not serialize access
      concept: db.isolation-levels
      gloss: 직렬화 실패는 높은 격리 수준에서 동시 트랜잭션이 충돌할 때 DB가 한쪽을 오류로 중단시키는 것이다. 이 오류는 정상 동작이다. 따라서 애플리케이션이 트랜잭션 전체를 재시도해야 한다.
    - id: g.shared-exclusive-lock
      name: 공유 잠금과 배타 잠금
      aliases:
        - Shared Lock
        - Exclusive Lock
        - S Lock
        - X Lock
      concept: db.locking
      gloss: 공유 잠금은 여러 트랜잭션이 함께 잡을 수 있지만 수정은 막는다. 배타 잠금은 한 트랜잭션만 잡을 수 있고 다른 잠금을 모두 막는다. 잠금 대기를 분석하려면 어떤 모드끼리 충돌하는지 알아야 한다.
    - id: g.lock-timeout
      name: lock_timeout과 statement_timeout
      aliases:
        - lock_timeout
        - statement_timeout
        - 잠금 타임아웃
      concept: db.locking
      gloss: lock_timeout은 잠금을 기다리는 최대 시간이고, statement_timeout은 SQL 문 하나의 최대 실행 시간이다. 둘 다 PostgreSQL 설정이다. 운영 중 DDL 전에 짧게 걸어 두면 잠금 대기가 전체 쿼리를 막는 장애를 줄일 수 있다.
    - id: g.dead-tuple
      name: 죽은 튜플
      aliases:
        - Dead Tuple
      concept: db.vacuum-bloat
      gloss: 튜플은 PostgreSQL에서 행의 한 버전을 뜻한다. 죽은 튜플은 수정·삭제 이후 어떤 트랜잭션에도 더는 보이지 않는 옛 버전이다. 정리되기 전까지 공간을 차지하고 스캔을 느리게 만든다.
    - id: g.autovacuum
      name: 오토배큠
      aliases:
        - Autovacuum
        - 자동 VACUUM
      concept: db.vacuum-bloat
      gloss: 오토배큠은 죽은 튜플이 쌓인 테이블을 감지해 VACUUM과 통계 갱신을 자동으로 실행하는 PostgreSQL 백그라운드 작업이다. 갱신이 잦은 테이블에서 이 작업이 따라가지 못하면 테이블이 팽창하고 쿼리가 느려진다.
    - id: g.table-bloat
      name: 테이블 팽창
      aliases:
        - Table Bloat
        - Bloat
        - 블로트
      concept: db.vacuum-bloat
      gloss: 테이블 팽창은 살아 있는 데이터에 비해 테이블·인덱스 파일이 훨씬 커진 상태다. 디스크 사용량이 늘고, 같은 쿼리도 더 많은 페이지를 읽어야 해서 느려진다.
    - id: g.checkpoint
      name: 체크포인트
      aliases:
        - Checkpoint
      concept: db.wal-and-durability
      gloss: 체크포인트는 메모리의 변경 데이터를 데이터 파일에 반영하고, 그 이전 WAL은 복구에 필요 없다고 표시하는 시점이다. 이 순간 쓰기가 몰려 I/O가 튈 수 있다. 간격이 길면 장애 후 복구 시간이 길어진다.
    - id: g.replication-slot
      name: 복제 슬롯
      aliases:
        - Replication Slot
      concept: db.replication
      gloss: 복제 슬롯은 복제본이 아직 받지 않은 WAL을 주 DB가 지우지 않고 보관하게 하는 PostgreSQL 장치다. 복제본이 사라져도 슬롯이 남아 있으면 WAL이 계속 쌓여 디스크가 가득 찰 수 있다.
    - id: g.failover
      name: 장애 조치
      aliases:
        - Failover
        - 페일오버
        - 승격
        - Promotion
      concept: db.replication
      gloss: 장애 조치는 주 DB가 죽었을 때 복제본을 새 주 DB로 승격해 서비스를 이어 가는 절차다. 비동기 복제라면 마지막 일부 커밋이 사라질 수 있다. 애플리케이션도 새 주 DB로 다시 연결해야 한다.
    - id: g.backfill
      name: 백필
      aliases:
        - Backfill
        - 데이터 백필
      concept: db.schema-migration
      gloss: 백필은 새로 추가한 컬럼이나 테이블에 기존 행의 값을 채워 넣는 작업이다. 큰 UPDATE를 한 번에 돌리면 잠금이 길어지고 WAL이 폭증한다. 그래서 작은 배치로 나눠 실행한다.
    - id: g.create-index-concurrently
      name: CREATE INDEX CONCURRENTLY
      aliases:
        - CONCURRENTLY
        - 온라인 인덱스 생성
      concept: db.schema-migration
      gloss: CREATE INDEX CONCURRENTLY는 테이블 쓰기를 막지 않고 인덱스를 만드는 PostgreSQL 옵션이다. 일반 인덱스 생성은 작업 내내 쓰기를 막으므로 운영 테이블에는 이 방식을 쓴다. 단, 트랜잭션 블록 안에서는 실행할 수 없다.
