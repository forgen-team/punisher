area: foundations
concepts:
    found.running-programs: 프로그램은 컴퓨터가 차례대로 따라 하는 명령의 목록이다. 사람이 쓴 소스 코드를 컴퓨터가 실행할 수 있는 형태로 바꾸고, 실행하면 메모리에 올라가 CPU가 한 단계씩 처리한다.
    found.code-basics: 코드는 값을 이름으로 담는 변수, 상황에 따라 갈라지는 조건, 같은 일을 되풀이하는 반복, 자주 하는 일을 묶은 함수로 이루어진다. 이 넷을 알아보면 처음 보는 코드의 흐름도 따라갈 수 있다.
    found.data-shapes: 값에는 형태가 있다. 숫자와 문자열 같은 낱개 값, 순서대로 늘어놓은 리스트, 이름표(키)로 값을 찾는 사전이 기본이다. "10"과 10이 다르게 다뤄지는 것처럼 형태에 따라 할 수 있는 일이 달라진다.
    found.files-and-paths: 자료는 파일에 담기고 파일은 폴더 안에 나무 모양으로 정리된다. 경로는 그 나무에서 파일까지 가는 주소로, 맨 위에서 적는 절대 경로와 지금 위치에서 적는 상대 경로가 있다.
    found.terminal-and-shell: 터미널은 글자로 명령하는 창이고, 셸은 그 명령을 받아 실행하는 프로그램이다. pwd, cd, ls 같은 몇 가지 명령만 알아도 개발 도구 설치 안내를 읽고 따라 할 수 있다.
    found.internet-and-web: 인터넷은 컴퓨터를 잇는 연결망이고 웹은 그 위에서 문서와 서비스를 주고받는 방식이다. 클라이언트가 요청하고 서버가 응답하며, URL은 자원의 주소, 도메인은 서버를 부르는 이름이다.
    found.what-browsers-do: 브라우저는 서버에서 받은 파일을 해석해 화면을 그리는 프로그램이다. HTML은 내용과 구조, CSS는 모양, JavaScript는 동작을 맡는다.
    found.http-first-look: HTTP는 클라이언트가 원하는 것을 요청하고 서버가 응답하는 약속이다. 요청에는 메서드와 URL이, 응답에는 200·404·500 같은 상태 코드와 내용이 담긴다.
    found.json-and-api: API는 프로그램끼리 정해진 방식으로 일을 부탁하고 결과를 받는 창구이고, JSON은 그때 주고받는 가장 흔한 글자 형식이다. 사전과 리스트를 글자로 적은 모양이라 사람도 읽을 수 있다.
    found.tables-and-sql: 많은 서비스는 데이터를 행과 열로 된 표에 저장한다. SQL은 그 표에서 조건에 맞는 행을 원하는 순서로 달라고 말하는 언어로, 스프레드시트의 필터·정렬과 같은 일을 한다.
    found.git-version-control: 버전 관리는 파일이 언제 누구에 의해 어떻게 바뀌었는지 기록해 예전 상태로 돌아갈 수 있게 하는 방법이다. git은 변경을 커밋으로 저장하고 브랜치로 따로 작업한 뒤 합친다.
    found.hosting-and-deploy: 다른 사람이 접속하려면 사이트가 늘 켜져 있는 서버에 있어야 한다. 그 자리를 빌리는 것이 호스팅이고, 새 버전을 서버에 올려 실제로 바꾸는 일이 배포다.
    found.reading-errors: 에러 메시지는 프로그램이 어디서 무엇 때문에 멈췄는지 알려 주는 단서다. 오류 종류와 파일·줄 번호를 읽고, 한 번에 하나씩 바꿔 확인하는 것이 디버깅의 시작이다.
