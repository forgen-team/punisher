name: 버그 / Bug
description: 동작이 이상하거나 오류가 나요 / Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요 / What happened
      description: 어떤 화면에서 무엇을 눌렀고 무엇이 보였는지 / Screen, action, result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작 / Expected
  - type: input
    id: version
    attributes:
      label: 버전과 OS / Version and OS
      description: "`punisher --version` 결과와 macOS·Linux 버전"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 / Logs
      description: 터미널 출력. 비밀번호·토큰·개인 정보는 지워 주세요 / Remove secrets and personal data
      render: text
