name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read # @forgen-team/* from GitHub Packages (web/.npmrc)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: cd web && npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # go vet · go test · typecheck · lint · vitest. The web build is not needed:
      # internal/webui embeds dist/ with a .gitkeep, so Go compiles without it.
      - name: Test
        run: make test
