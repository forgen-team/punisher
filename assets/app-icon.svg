  <path d="M32 55 C38 49.5 48 48.5 58 50.5" stroke="url(#punisher-accent)" stroke-width="6" stroke-linecap="round"/>
  <!-- The forgen flame, rising from the open book. -->
  <path transform="translate(1.6 4.25) scale(0.95)" d="M32 15 C37 22 42 27 41 35 C40.3 41 36.5 45 32 45 C27 45 23 41 23.5 35.5 C24 31 27 28.5 27.5 23.5 C30 25.5 30.8 28 30.8 30.5 C33 27 33.5 21 32 15 Z" fill="url(#punisher-flame)"/>
</svg>
