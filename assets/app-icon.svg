<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 92 92" fill="none" role="img" aria-label="Punisher">
  <title>Punisher</title>
  <defs>
    <linearGradient id="punisher-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="punisher-flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="-14" y="-14" width="92" height="92" rx="20" fill="#0f0f23"/>
  <!-- Half a clock face: thirty minutes a day. -->
  <path d="M10 33 A22 22 0 0 1 54 33" stroke="url(#punisher-accent)" stroke-width="6" stroke-linecap="round"/>
  <!-- An open book: the lecture. -->
